const SchoolScheduleManager = () => {
    const [activeTab, setActiveTab] = useState('dashboard');

        { id: 1, name: 'Andrea Adamoli', email: 'adamoli@scuola.it', subject: 'Gaming' },

    const [lessons, setLessons] = useState([]);

    const [showAddCourse, setShowAddCourse] = useState(false);

    const [editingLesson, setEditingLesson] = useState(null);
    const [showAddTeacher, setShowAddTeacher] = useState(false);
    const [showEditTeacher, setShowEditTeacher] = useState(false);
    const [editingTeacher, setEditingTeacher] = useState(null);
    const [showAddRoom, setShowAddRoom] = useState(false);
    const [showEditRoom, setShowEditRoom] = useState(false);
    const [editingRoom, setEditingRoom] = useState(null);
    const [viewMode, setViewMode] = useState('week');
    const [selectedDate, setSelectedDate] = useState(new Date());
    const [selectedLesson, setSelectedLesson] = useState(null);
    const [showEditLessonDetails, setShowEditLessonDetails] = useState(false);
    
   const [newCourse, setNewCourse] = useState({
    name: '',
    totalHours: 0,

});

    const italianDays = ['Domenica', 'Lunedì', 'Martedì', 'Mercoledì', 'Giovedì', 'Venerdì', 'Sabato'];

    const formatDate = (date) => {
        const d = new Date(date);
        return d.toISOString().split('T')[0];
    };

    const navigateWeek = (direction) => {
    const newDate = new Date(selectedDate);
    newDate.setDate(newDate.getDate() + (direction * 7));
    setSelectedDate(newDate);
};

const navigateMonth = (direction) => {
    const newDate = new Date(selectedDate);
    newDate.setDate(1); // Imposta sempre al primo giorno per evitare overflow
    newDate.setMonth(newDate.getMonth() + direction);
    setSelectedDate(newDate);
};

const getWeekDates = () => {
    const curr = new Date(selectedDate);
    const dayOfWeek = curr.getDay();
    // Se domenica (0), torna indietro di 6 giorni per arrivare a lunedì
    // Altrimenti calcola la differenza per arrivare a lunedì (1)
    const diff = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
    
    // Trova il lunedì della settimana
    const monday = new Date(curr);
    monday.setDate(curr.getDate() + diff);
    
    // Genera i 6 giorni della settimana (Lun-Sab)
    const dates = [];
    for (let i = 0; i < 6; i++) {
        const date = new Date(monday);
        date.setDate(monday.getDate() + i);
        dates.push(date);
    }
    return dates;
};

const getMonthDays = () => {
    const year = selectedDate.getFullYear();
    const month = selectedDate.getMonth();
    const firstDay = new Date(year, month, 1);
    const lastDay = new Date(year, month + 1, 0);
    const daysInMonth = lastDay.getDate();
    const startDayOfWeek = firstDay.getDay() === 0 ? 6 : firstDay.getDay() - 1; // Lun=0
    
    const days = [];
    // Giorni vuoti prima del primo giorno del mese
    for (let i = 0; i < startDayOfWeek; i++) {
        days.push(null);
    }
    // Giorni del mese
    for (let i = 1; i <= daysInMonth; i++) {
        days.push(new Date(year, month, i));
    }
    return days;
};

const startEditLessonDetails = (lesson) => {
    setEditingLesson({...lesson});
    setShowEditLessonDetails(true);
};

const updateLessonDetails = () => {
    if (editingLesson.teacherId && editingLesson.roomId && editingLesson.subject && editingLesson.numberOfStudents) {
        const conflict = checkConflict(editingLesson);
        if (conflict && conflict !== `L'aula già occupata in questo orario`) {
            alert(`Errore: ${conflict}`);
            return;
        }
        
        setLessons(lessons.map(l => l.id === editingLesson.id ? {

            duration: parseInt(editingLesson.duration),
            numberOfStudents: parseInt(editingLesson.numberOfStudents)
        } : l));
        setShowEditLessonDetails(false);
        setEditingLesson(null);
        setSelectedLesson(null);
    }
};

   const addCourse = () => {
    if (newCourse.name && newCourse.totalHours && newCourse.startDate && newCourse.endDate && newCourse.numberOfStudents) {
        const course = {
            ...newCourse,
            id: Date.now(),

            }))
        };
        setCourses([...courses, course]);
        setNewCourse({
            name: '',

            maxConsecutiveHours: 4,
            startDate: '',
            endDate: '',
            subjects: [],
            teachers: [],
            stageStartDate: '',
            stageEndDate: '',
            numberOfStudents: ''
        });
        setShowAddCourse(false);
    }
};

    const startEditCourse = (course) => {
        setEditingCourse({...course});
        setShowEditCourse(true);
    };

   const updateCourse = () => {
    if (editingCourse.name && editingCourse.totalHours && editingCourse.startDate && editingCourse.endDate && editingCourse.numberOfStudents) {
        setCourses(courses.map(c => c.id === editingCourse.id ? {
            ...editingCourse,
            totalHours: parseInt(editingCourse.totalHours),
            maxDailyHours: parseInt(editingCourse.maxDailyHours),
            maxConsecutiveHours: parseInt(editingCourse.maxConsecutiveHours),
            numberOfStudents: parseInt(editingCourse.numberOfStudents),
            teachers: (editingCourse.teachers || []).map(t => ({
                teacherId: parseInt(t.teacherId),
                hours: parseInt(t.hours)
            }))
        } : c));
        setShowEditCourse(false);
        setEditingCourse(null);
    }
};

    const deleteCourse = (id) => {
        if (window.confirm('Sei sicuro di voler eliminare questo corso?')) {
            setCourses(courses.filter(c => c.id !== id));
            setLessons(lessons.filter(l => l.courseId !== id));
        }
    };

    const duplicateCourse = (course) => {
    const duplicatedCourse = {
        ...course,
        id: Date.now(),
        name: course.name + ' COPIA'
    };
    setCourses([...courses, duplicatedCourse]);
    alert(`Corso "${course.name}" duplicato con successo come "${duplicatedCourse.name}"!`);
};

    const addSubjectToCourse = (courseState, setCourseState) => {
        const newSubjects = [...courseState.subjects, { name: '', hours: 0 }];
        setCourseState({...courseState, subjects: newSubjects});
    };

    const updateSubject = (courseState, setCourseState, index, field, value) => {
        const newSubjects = [...courseState.subjects];
        newSubjects[index][field] = field === 'hours' ? parseInt(value) || 0 : value;
        setCourseState({...courseState, subjects: newSubjects});
    };

    const removeSubject = (courseState, setCourseState, index) => {
        const newSubjects = courseState.subjects.filter((_, i) => i !== index);
        setCourseState({...courseState, subjects: newSubjects});
    };

    const addTeacherToCourse = (courseState, setCourseState) => {
    const newTeachers = [...(courseState.teachers || []), { teacherId: '', hours: 0 }];
    setCourseState({...courseState, teachers: newTeachers});
};

const updateCourseTeacher = (courseState, setCourseState, index, field, value) => {
    const newTeachers = [...courseState.teachers];
    newTeachers[index][field] = field === 'hours' ? parseInt(value) || 0 : value;
    setCourseState({...courseState, teachers: newTeachers});
};

const removeCourseTeacher = (courseState, setCourseState, index) => {
    const newTeachers = courseState.teachers.filter((_, i) => i !== index);
    setCourseState({...courseState, teachers: newTeachers});
};

    const autoScheduleCourse = (course) => {
    if (!course.startDate || !course.endDate) {
        alert('Il corso deve avere una data di inizio e fine');
        return;
    }

    const newLessons = [];
    const startDate = new Date(course.startDate);
    const endDate = new Date(course.endDate);
    const stageStart = course.stageStartDate ? new Date(course.stageStartDate) : null;
    const stageEnd = course.stageEndDate ? new Date(course.stageEndDate) : null;

    let currentDate = new Date(startDate);
    let totalScheduledHours = 0;
    let subjectIndex = 0;
    let currentSubjectHours = 0;

    const subjects = course.subjects.length > 0 ? course.subjects : [{name: course.name, hours: course.totalHours}];

    while (totalScheduledHours < course.totalHours && currentDate <= endDate) {
        const dayOfWeek = currentDate.getDay();
        if (dayOfWeek === 0 || dayOfWeek === 6) {
            currentDate.setDate(currentDate.getDate() + 1);
            continue;
        }

        if (stageStart && stageEnd && currentDate >= stageStart && currentDate <= stageEnd) {
            currentDate.setDate(currentDate.getDate() + 1);
            continue;
        }

        const remainingHours = course.totalHours - totalScheduledHours;
        // OBIETTIVO: almeno 6 ore al giorno quando possibile
        const todayHours = Math.min(Math.max(course.maxDailyHours, 6), remainingHours);

        if (todayHours > 0 && subjectIndex < subjects.length) {
            const currentSubject = subjects[subjectIndex];
            const subjectRemainingHours = currentSubject.hours - currentSubjectHours;
            const hoursToSchedule = Math.min(todayHours, subjectRemainingHours);

            const room = rooms.find(r => r.capacity >= course.numberOfStudents);

            if (!room) {
                alert(`ERRORE: Nessuna aula disponibile con almeno ${course.numberOfStudents} posti. La calendarizzazione si ferma.`);
                break;
            }

            const dateStr = formatDate(currentDate);
            const existingLessonsToday = [...lessons, ...newLessons].filter(l => l.date === dateStr);
            
            // PAUSA PRANZO 13:00-14:00: escluso '13:00'
            const possibleStartTimes = ['09:00', '10:00', '11:00', '12:00', '14:00', '15:00', '16:00', '17:00'];
            
            let hoursScheduledToday = 0;
            const maxHoursToday = Math.min(Math.max(course.maxDailyHours, 6), hoursToSchedule);
            
            const teacherHoursScheduled = {};
            if (course.teachers && course.teachers.length > 0) {
                course.teachers.forEach(ct => {
                    teacherHoursScheduled[ct.teacherId] = 0;
                });
                
                [...lessons, ...newLessons].forEach(lesson => {
                    if (lesson.courseId === course.id && teacherHoursScheduled[lesson.teacherId] !== undefined) {
                        teacherHoursScheduled[lesson.teacherId] += lesson.duration;
                    }
                });
            }
            
            for (let startTime of possibleStartTimes) {
                if (hoursScheduledToday >= maxHoursToday) break;
                
                const startHour = parseInt(startTime.split(':')[0]);
                const lessonDuration = Math.min(
                    course.maxConsecutiveHours,
                    maxHoursToday - hoursScheduledToday,
                    hoursToSchedule - hoursScheduledToday
                );
                const endHour = startHour + lessonDuration;
                
                // VERIFICA CHE LA LEZIONE NON INVADA LA PAUSA PRANZO 13:00-14:00
                if (startHour < 14 && endHour > 13) {
                    continue; // Salta questo slot perché invaderebbe la pausa pranzo
                }
                
                let isRoomAvailable = true;
                for (let existing of existingLessonsToday) {
                    const existingStart = parseInt(existing.startTime.split(':')[0]);
                    const existingEnd = existingStart + existing.duration;
                    
                    if ((startHour < existingEnd && endHour > existingStart)) {
                        isRoomAvailable = false;
                        break;
                    }
                }
                
                if (!isRoomAvailable) continue;
                
                let selectedTeacher = null;
                
                if (course.teachers && course.teachers.length > 0) {
                    for (let courseTeacher of course.teachers) {
                        const scheduledForThisTeacher = teacherHoursScheduled[courseTeacher.teacherId] || 0;
                        
                        if (scheduledForThisTeacher >= courseTeacher.hours) continue;
                        
                        let teacherAvailable = true;
                        for (let existing of existingLessonsToday) {
                            if (existing.teacherId === courseTeacher.teacherId) {
                                const existingStart = parseInt(existing.startTime.split(':')[0]);
                                const existingEnd = existingStart + existing.duration;
                                
                                // Lezioni consecutive stesso docente: OK, nessuna pausa necessaria
                                if (existingEnd === startHour) {
                                    continue;
                                }
                                
                                // Altrimenti verifica sovrapposizione normale
                                if ((startHour < existingEnd && endHour > existingStart)) {
                                    teacherAvailable = false;
                                    break;
                                }
                            }
                        }
                        
                        if (teacherAvailable) {
                            selectedTeacher = teachers.find(t => t.id === courseTeacher.teacherId);
                            break;
                        }
                    }
                } else {
                    selectedTeacher = teachers.find(t => 
                        t.subject.toLowerCase().includes(currentSubject.name.toLowerCase()) || 
                        currentSubject.name.toLowerCase().includes(t.subject.toLowerCase())
                    ) || teachers[0];
                }
                
                if (!selectedTeacher) {
                    console.log(`Nessun docente disponibile per lo slot ${startTime}`);
                    continue;
                }
                
                const tempLesson = {
                    teacherId: selectedTeacher.id,
                    roomId: room.id,
                    date: dateStr,
                    dayOfWeek: italianDays[currentDate.getDay()],
                    startTime: startTime,
                    duration: lessonDuration,
                    subject: currentSubject.name,
                    courseId: course.id,
                    numberOfStudents: course.numberOfStudents
                };

                const conflict = checkConflict(tempLesson);
                if (!conflict) {
                    newLessons.push({
                        id: Date.now() + newLessons.length,
                        ...tempLesson
                    });
                    
                    existingLessonsToday.push(tempLesson);
                    hoursScheduledToday += lessonDuration;
                    totalScheduledHours += lessonDuration;
                    currentSubjectHours += lessonDuration;
                    
                    if (teacherHoursScheduled[selectedTeacher.id] !== undefined) {
                        teacherHoursScheduled[selectedTeacher.id] += lessonDuration;
                    }
                    
                    if (currentSubjectHours >= currentSubject.hours) {
                        subjectIndex++;
                        currentSubjectHours = 0;
                    }
                }
            }
            
            if (hoursScheduledToday === 0) {
                console.log(`Impossibile schedulare lezioni per ${dateStr}`);
            }
        }

        currentDate.setDate(currentDate.getDate() + 1);
    }

    if (newLessons.length > 0) {
        setLessons([...lessons, ...newLessons]);
        alert(`Corso calendarizzato! Create ${newLessons.length} lezioni per un totale di ${totalScheduledHours} ore.`);
    } else {
        alert('Impossibile calendarizzare il corso.');
    }
};

//inizio della funzione autoScheduleAllCourses

const autoScheduleAllCourses = () => {
    if (courses.length === 0) {
        alert('Nessun corso da calendarizzare!');
        return;
    }
    
    for (let course of courses) {
        if (!course.startDate || !course.endDate) {
            alert(`Il corso "${course.name}" non ha una data di inizio/fine. Impossibile procedere.`);
            return;
        }
    }
    
    if (!window.confirm(`Vuoi calendarizzare automaticamente tutti i ${courses.length} corsi alternandoli?\n\nQuesta operazione potrebbe richiedere alcuni secondi.`)) {
        return;
    }
    
    const newLessons = [];
    
    let globalStartDate = new Date(Math.min(...courses.map(c => new Date(c.startDate))));
    let globalEndDate = new Date(Math.max(...courses.map(c => new Date(c.endDate))));
    
    const courseProgress = {};
    courses.forEach(c => {
        courseProgress[c.id] = {
            totalScheduled: 0,
            subjectIndex: 0,
            currentSubjectHours: 0
        };
    });
    
    let currentDate = new Date(globalStartDate);
    
    while (currentDate <= globalEndDate) {
        const dayOfWeek = currentDate.getDay();
        
        if (dayOfWeek === 0 || dayOfWeek === 6) {
            currentDate.setDate(currentDate.getDate() + 1);
            continue;
        }
        
        const dateStr = formatDate(currentDate);
        const existingLessonsToday = newLessons.filter(l => l.date === dateStr);
        
        // PAUSA PRANZO 13:00-14:00: escluso '13:00'
        const possibleStartTimes = ['09:00', '10:00', '11:00', '12:00', '14:00', '15:00', '16:00', '17:00'];
        
        // Cerca di riempire almeno 6 ore al giorno alternando i corsi
        for (let course of courses) {
            const courseStart = new Date(course.startDate);
            const courseEnd = new Date(course.endDate);
            const stageStart = course.stageStartDate ? new Date(course.stageStartDate) : null;
            const stageEnd = course.stageEndDate ? new Date(course.stageEndDate) : null;
            
            if (currentDate < courseStart || currentDate > courseEnd) continue;
            if (stageStart && stageEnd && currentDate >= stageStart && currentDate <= stageEnd) continue;
            if (courseProgress[course.id].totalScheduled >= course.totalHours) continue;
            
            const progress = courseProgress[course.id];
            const subjects = course.subjects.length > 0 ? course.subjects : [{name: course.name, hours: course.totalHours}];
            
            if (progress.subjectIndex >= subjects.length) continue;
            
            const currentSubject = subjects[progress.subjectIndex];
            const room = rooms.find(r => r.capacity >= course.numberOfStudents);
            
            if (!room) continue;
            
            for (let startTime of possibleStartTimes) {
                const startHour = parseInt(startTime.split(':')[0]);
                const remainingHours = course.totalHours - progress.totalScheduled;
                // Prova a schedulare più ore possibili (fino a 3 ore consecutive)
                const lessonDuration = Math.min(course.maxConsecutiveHours, remainingHours, 3);
                const endHour = startHour + lessonDuration;
                
                // VERIFICA CHE LA LEZIONE NON INVADA LA PAUSA PRANZO 13:00-14:00
                if (startHour < 14 && endHour > 13) {
                    continue;
                }
                
                let isAvailable = true;
                for (let existing of existingLessonsToday) {
                    const existingStart = parseInt(existing.startTime.split(':')[0]);
                    const existingEnd = existingStart + existing.duration;
                    
                    if ((startHour < existingEnd && endHour > existingStart)) {
                        isAvailable = false;
                        break;
                    }
                }
                
                if (!isAvailable) continue;
                
                let selectedTeacher = null;
                if (course.teachers && course.teachers.length > 0) {
                    const teacherHoursScheduled = {};
                    course.teachers.forEach(ct => teacherHoursScheduled[ct.teacherId] = 0);
                    
                    newLessons.filter(l => l.courseId === course.id).forEach(lesson => {
                        if (teacherHoursScheduled[lesson.teacherId] !== undefined) {
                            teacherHoursScheduled[lesson.teacherId] += lesson.duration;
                        }
                    });
                    
                    for (let courseTeacher of course.teachers) {
                        const scheduledForThisTeacher = teacherHoursScheduled[courseTeacher.teacherId] || 0;
                        if (scheduledForThisTeacher < courseTeacher.hours) {
                            let teacherAvailable = true;
                            for (let existing of existingLessonsToday) {
                                if (existing.teacherId === courseTeacher.teacherId) {
                                    const existingStart = parseInt(existing.startTime.split(':')[0]);
                                    const existingEnd = existingStart + existing.duration;
                                    
                                    // Lezioni consecutive stesso docente: OK
                                    if (existingEnd === startHour) {
                                        continue;
                                    }
                                    
                                    if ((startHour < existingEnd && endHour > existingStart)) {
                                        teacherAvailable = false;
                                        break;
                                    }
                                }
                            }
                            if (teacherAvailable) {
                                selectedTeacher = teachers.find(t => t.id === courseTeacher.teacherId);
                                break;
                            }
                        }
                    }
                } else {
                    selectedTeacher = teachers.find(t => 
                        t.subject.toLowerCase().includes(currentSubject.name.toLowerCase()) || 
                        currentSubject.name.toLowerCase().includes(t.subject.toLowerCase())
                    ) || teachers[0];
                }
                
                if (!selectedTeacher) continue;
                
                const newLesson = {
                    id: Date.now() + newLessons.length,
                    teacherId: selectedTeacher.id,
                    roomId: room.id,
                    date: dateStr,
                    dayOfWeek: italianDays[currentDate.getDay()],
                    startTime: startTime,
                    duration: lessonDuration,
                    subject: currentSubject.name,
                    courseId: course.id,
                    numberOfStudents: course.numberOfStudents
                };
                
                newLessons.push(newLesson);
                existingLessonsToday.push(newLesson);
                
                progress.totalScheduled += lessonDuration;
                progress.currentSubjectHours += lessonDuration;
                
                if (progress.currentSubjectHours >= currentSubject.hours) {
                    progress.subjectIndex++;
                    progress.currentSubjectHours = 0;
                }
                
                break;
            }
        }
        
        currentDate.setDate(currentDate.getDate() + 1);
    }
    
    if (newLessons.length > 0) {
        setLessons([...lessons, ...newLessons]);
        alert(`✅ Calendarizzazione completata!\n\nCreate ${newLessons.length} lezioni per ${courses.length} corsi.\n\nI corsi sono stati distribuiti alternandoli nei giorni disponibili.`);
    } else {
        alert('❌ Impossibile calendarizzare i corsi. Verifica le date e le disponibilità.');
    }
};

                                <div className="grid grid-cols-2 gap-4">
                                    <input type="text" value={editingRoom.name} onChange={(e) => setEditingRoom({...editingRoom, name: e.target.value})} placeholder="Nome aula" className="p-2 border rounded"/>
                                    <input type="number" min="1" max="100" value={editingRoom.capacity} onChange={(e) => setEditingRoom({...editingRoom, capacity: e.target.value})} placeholder="Numero posti" className="p-2 border rounded"/>
                                    <select value={editingRoom.type} onChange={(e) => setEditingRoom({...editingRoom, type: e.target.value})} className="p-2 border rounded">
                                        <option value="Informatica">Informatica</option>
                                        <option value="Parrucchieri">Parrucchieri</option>
                                        <option value="Didattica">Didattica</option>
                                        <option value="Laboratorio">Laboratorio</option>
                                        <option value="Aula Magna">Aula Magna</option>
                                    </select>
                                    <label className="flex items-center gap-2 p-2 border rounded bg-white cursor-pointer">
                                        <input type="checkbox" checked={editingRoom.hasProjector} onChange={(e) => setEditingRoom({...editingRoom, hasProjector: e.target.checked})} className="w-4 h-4"/>
                                        <span>Proiettore disponibile</span>
                                    </label>
                                </div>
                                <div className="flex gap-2 mt-4">
                                    <button onClick={updateRoom} className="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Aggiorna</button>
                                    <button onClick={() => {setShowEditRoom(false); setEditingRoom(null);}} className="px-4 py-2 bg-gray-400 text-white rounded hover:bg-gray-500">Annulla</button>
                                </div>
                            </div>
                        )}

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            {rooms.map(room => (
                                <div key={room.id} className="border-2 rounded-lg p-6 hover:border-blue-500 transition">
                                    <div className="flex items-start justify-between mb-4">
                                        <div className="flex-1">
                                            <h3 className="text-xl font-bold text-gray-800">{room.name}</h3>
                                            <div className="flex items-center gap-2 mt-1">
                                                <span className="text-sm px-2 py-1 bg-gray-200 rounded">{room.type}</span>
                                                {room.hasProjector && (
                                                    <span className="text-sm px-2 py-1 bg-green-100 text-green-800 rounded">📽️ Proiettore</span>
                                                )}
                                            </div>
                                        </div>
                                        <div className="bg-blue-100 px-3 py-1 rounded-full">
                                            <span className="font-semibold text-blue-800">{room.capacity} posti</span>
                                        </div>
                                    </div>
                                    <div className="flex gap-2 pt-4 border-t">
                                        <button onClick={() => startEditRoom(room)} className="flex-1 flex items-center justify-center gap-2 px-3 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">
                                            <EditIcon />Modifica
                                        </button>
                                        <button onClick={() => deleteRoom(room.id)} className="flex-1 flex items-center justify-center gap-2 px-3 py-2 bg-red-600 text-white rounded hover:bg-red-700">
                                            <Trash2Icon />Elimina
                                        </button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                )}
            </div>
        </div>
    );
};

ReactDOM.render(<SchoolScheduleManager />, document.getElementById('root'));
    </script>
</body>
</html>
