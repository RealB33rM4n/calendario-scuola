    <script type="text/babel">
    const { useState } = React;

const CalendarIcon = () => (<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>);
const UsersIcon = () => (<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>);

const Trash2Icon = () => (<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 4 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>);
const EditIcon = () => (<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>);
const ClockIcon = () => (<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>);

const TIME_SLOTS = [
    '08:00', '09:00', '10:00', '11:00', '12:00', '13:00', 
    '14:00', '15:00', '16:00', '17:00', '18:00', '19:00'
];

const COURSE_COLORS = [
    { bg: 'bg-red-500', text: 'text-white', border: 'border-red-600', light: 'bg-red-50', badge: 'bg-red-100 text-red-800' },
    { bg: 'bg-blue-500', text: 'text-white', border: 'border-blue-600', light: 'bg-blue-50', badge: 'bg-blue-100 text-blue-800' },
    { bg: 'bg-green-600', text: 'text-white', border: 'border-green-700', light: 'bg-green-50', badge: 'bg-green-100 text-green-800' },
    { bg: 'bg-yellow-500', text: 'text-gray-900', border: 'border-yellow-600', light: 'bg-yellow-50', badge: 'bg-yellow-100 text-yellow-800' },
    { bg: 'bg-purple-600', text: 'text-white', border: 'border-purple-700', light: 'bg-purple-50', badge: 'bg-purple-100 text-purple-800' },
    { bg: 'bg-pink-600', text: 'text-white', border: 'border-pink-700', light: 'bg-pink-50', badge: 'bg-pink-100 text-pink-800' },
    { bg: 'bg-indigo-600', text: 'text-white', border: 'border-indigo-700', light: 'bg-indigo-50', badge: 'bg-indigo-100 text-indigo-800' },
    { bg: 'bg-teal-600', text: 'text-white', border: 'border-teal-700', light: 'bg-teal-50', badge: 'bg-teal-100 text-teal-800' },
    { bg: 'bg-orange-600', text: 'text-white', border: 'border-orange-700', light: 'bg-orange-50', badge: 'bg-orange-100 text-orange-800' },
    { bg: 'bg-cyan-600', text: 'text-white', border: 'border-cyan-700', light: 'bg-cyan-50', badge: 'bg-cyan-100 text-cyan-800' }
];

const SchoolScheduleManager = () => {
    const [activeTab, setActiveTab] = useState('dashboard');
    const [teachers, setTeachers] = useState([
        { id: 1, name: 'Andrea Adamoli', email: 'adamoli@scuola.it', subject: 'Gaming', unavailability: [] },
        { id: 2, name: 'Francesco Natali', email: 'natali@scuola.it', subject: 'Grafica', unavailability: [] },
        { id: 3, name: 'Francesco Acciai', email: 'acciai@scuola.it', subject: 'Informatica', unavailability: [] },
        { id: 4, name: 'Marco Guzzo', email: 'guzzo@scuola.it', subject: 'Programmazione', unavailability: [] },
        { id: 5, name: 'Matteoli Valentina', email: 'matteoli@scuola.it', subject: 'Materie di Base', unavailability: [] },
        { id: 6, name: 'Bucci Antonia', email: 'bucci@scuola.it', subject: 'Matematica', unavailability: [] },
        { id: 7, name: 'Fabbresci Milena', email: 'fabbresci@scuola.it', subject: 'Politica', unavailability: [] }
    ]);
    const [rooms, setRooms] = useState([
        { id: 1, name: 'D. Calamandrei', capacity: 20, type: 'Informatica', hasProjector: true },
        { id: 2, name: 'Don L. Milani', capacity: 28, type: 'Parrucchieri', hasProjector: true },
        { id: 3, name: 'A. Turing', capacity: 25, type: 'Informatica', hasProjector: false },
        { id: 4, name: 'Aula Piccola', capacity: 12, type: 'Didattica', hasProjector: false }
    ]);
    const [lessons, setLessons] = useState([]);
    const [courses, setCourses] = useState([]);
    const [viewMode, setViewMode] = useState('week');
    const [selectedDate, setSelectedDate] = useState(new Date());
    const [selectedLesson, setSelectedLesson] = useState(null);
    
    const [showAddCourse, setShowAddCourse] = useState(false);
    const [showEditCourse, setShowEditCourse] = useState(false);
    const [editingCourse, setEditingCourse] = useState(null);
    const [showAddLesson, setShowAddLesson] = useState(false);
    const [showEditLessonDetails, setShowEditLessonDetails] = useState(false);
    const [editingLesson, setEditingLesson] = useState(null);
    const [showAddTeacher, setShowAddTeacher] = useState(false);
    const [showEditTeacher, setShowEditTeacher] = useState(false);
    const [editingTeacher, setEditingTeacher] = useState(null);
    const [showAddRoom, setShowAddRoom] = useState(false);
    const [showEditRoom, setShowEditRoom] = useState(false);
    const [editingRoom, setEditingRoom] = useState(null);

    const [newCourse, setNewCourse] = useState({
        name: '', totalHours: 0, maxDailyHours: 4, maxConsecutiveHours: 4,
        startDate: '', endDate: '', subjects: [], teachers: [],
        stageStartDate: '', stageEndDate: '', numberOfStudents: '', roomId: ''
    });
    const [newLesson, setNewLesson] = useState({
        teacherId: '', roomId: '', date: new Date().toISOString().split('T')[0],
        startTime: '09:00', duration: 1, subject: '', numberOfStudents: '', courseId: ''
    });
    const [newTeacher, setNewTeacher] = useState({ name: '', email: '', subject: '', unavailability: [] });
    const [newRoom, setNewRoom] = useState({ name: '', capacity: 20, type: 'Didattica', hasProjector: false });

    const italianDays = ['Domenica', 'Lunedì', 'Martedì', 'Mercoledì', 'Giovedì', 'Venerdì', 'Sabato'];

    const formatDate = (date) => new Date(date).toISOString().split('T')[0];

    const getCourseColor = (courseId) => {
        if (!courseId) return COURSE_COLORS[0];
        return COURSE_COLORS[courseId % COURSE_COLORS.length];
    };

    const navigateWeek = (direction) => {
        const newDate = new Date(selectedDate);
        newDate.setDate(newDate.getDate() + (direction * 7));
        setSelectedDate(newDate);
    };

    const navigateMonth = (direction) => {
        const newDate = new Date(selectedDate);
        newDate.setDate(1);
        newDate.setMonth(newDate.getMonth() + direction);
        setSelectedDate(newDate);
    };

    const getWeekDates = () => {
        const curr = new Date(selectedDate);
        const dayOfWeek = curr.getDay();
        const diff = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
        const monday = new Date(curr);
        monday.setDate(curr.getDate() + diff);
        const dates = [];
        for (let i = 0; i < 6; i++) {
            const date = new Date(monday);
            date.setDate(monday.getDate() + i);
            dates.push(date);
        }
        return dates;
    };

    const getMonthDays = () => {
        const year = selectedDate.getFullYear();
        const month = selectedDate.getMonth();
        const firstDay = new Date(year, month, 1);
        const lastDay = new Date(year, month + 1, 0);
        const daysInMonth = lastDay.getDate();
        const startDayOfWeek = firstDay.getDay() === 0 ? 6 : firstDay.getDay() - 1;
        const days = [];
        for (let i = 0; i < startDayOfWeek; i++) days.push(null);
        for (let i = 1; i <= daysInMonth; i++) days.push(new Date(year, month, i));
        return days;
    };

    // Funzione per verificare se un docente è disponibile in un determinato giorno e ora
    const isTeacherAvailable = (teacherId, date, startTime) => {
        const teacher = teachers.find(t => t.id === teacherId);
        if (!teacher || !teacher.unavailability) return true;
        
        const dayOfWeek = new Date(date).getDay();
        
        for (const unavail of teacher.unavailability) {
            // Se è un giorno intero (senza timeSlots o timeSlots vuoto)
            if (unavail.day === dayOfWeek && (!unavail.timeSlots || unavail.timeSlots.length === 0)) {
                return false; // Docente non disponibile per tutto il giorno
            }
            
            // Se ha fasce orarie specifiche
            if (unavail.day === dayOfWeek && unavail.timeSlots && unavail.timeSlots.includes(startTime)) {
                return false; // Docente non disponibile in questa fascia oraria
            }
        }
        
        return true;
    };

    // Funzione per aggiungere indisponibilità  a un docente
    const addUnavailability = (teacher, day, timeSlot) => {
        const unavailability = teacher.unavailability || [];
        
        // Se timeSlot è null, significa che vuole bloccare tutto il giorno
        if (timeSlot === null) {
            // Rimuovi eventuali indisponibilità  orarie per questo giorno e aggiungi giorno intero
            const otherDays = unavailability.filter(u => u.day !== day);
            return {
                ...teacher,
                unavailability: [...otherDays, { day, timeSlots: [] }]
            };
        }
        
        // Altrimenti, aggiungi la fascia oraria specifica
        const dayUnavail = unavailability.find(u => u.day === day);
        
        if (dayUnavail) {
            // Se è un giorno intero bloccato, non fare nulla
            if (!dayUnavail.timeSlots || dayUnavail.timeSlots.length === 0) {
                return teacher;
            }
            
            // Aggiungi la fascia oraria se non è già  presente
            if (!dayUnavail.timeSlots.includes(timeSlot)) {
                return {
                    ...teacher,
                    unavailability: unavailability.map(u => 
                        u.day === day 
                            ? { ...u, timeSlots: [...u.timeSlots, timeSlot] }
                            : u
                    )
                };
            }
        } else {
            return {
                ...teacher,
                unavailability: [...unavailability, { day, timeSlots: [timeSlot] }]
            };
        }
        return teacher;
    };

    // Funzione per rimuovere indisponibilità 
    const removeUnavailability = (teacher, day, timeSlot) => {
        const unavailability = teacher.unavailability || [];
        
        // Se timeSlot è null, rimuovi l'intero giorno
        if (timeSlot === null) {
            return {
                ...teacher,
                unavailability: unavailability.filter(u => u.day !== day)
            };
        }
        
        // Altrimenti, rimuovi solo la fascia oraria specifica
        return {
            ...teacher,
            unavailability: unavailability.map(u => {
                if (u.day === day) {
                    const newTimeSlots = (u.timeSlots || []).filter(ts => ts !== timeSlot);
                    return { ...u, timeSlots: newTimeSlots };
                }
                return u;
            }).filter(u => u.timeSlots && u.timeSlots.length > 0)
        };
    };

    // Calcola le ore già  programmate per un corso
    const getCourseScheduledHours = (courseId) => {
        return lessons
            .filter(l => l.courseId === courseId)
            .reduce((sum, l) => sum + l.duration, 0);
    };

    // Calcola le ore rimanenti per un corso
    const getCourseRemainingHours = (courseId) => {
        const course = courses.find(c => c.id === courseId);
        if (!course) return 0;
        const scheduled = getCourseScheduledHours(courseId);
        return Math.max(0, course.totalHours - scheduled);
    };

    const checkConflict = (lesson, existingLessons = lessons) => {
        const room = rooms.find(r => r.id === parseInt(lesson.roomId));
        if (room && parseInt(lesson.numberOfStudents) > room.capacity) {
            return `L'aula ${room.name} ha solo ${room.capacity} posti, ma servono ${lesson.numberOfStudents} posti`;
        }
        
        const lessonStart = parseInt(lesson.startTime.split(':')[0]);
        const lessonEnd = lessonStart + parseInt(lesson.duration);
        
        for (let existing of existingLessons) {
            if (lesson.id && existing.id === lesson.id) continue;
            
            if (existing.date === lesson.date && existing.teacherId === parseInt(lesson.teacherId)) {
                const existingStart = parseInt(existing.startTime.split(':')[0]);
                const existingEnd = existingStart + existing.duration;
                
                if ((lessonStart >= existingStart && lessonStart < existingEnd) ||
                    (lessonEnd > existingStart && lessonEnd <= existingEnd) ||
                    (lessonStart <= existingStart && lessonEnd >= existingEnd)) {
                    const teacher = teachers.find(t => t.id === parseInt(lesson.teacherId));
                    return `L'insegnante ${teacher?.name} ha già  una lezione dalle ${existing.startTime} alle ${existingStart + existing.duration}:00`;
                }
            }
        }
        
        return null;
    };

    const findNextAvailableSlot = (dateStr, startHour, duration, roomId, teacherId, existingLessons) => {
        let currentHour = startHour;
        while (currentHour < 18) {
            if (currentHour === 13) { currentHour = 14; continue; }
            let canFit = true;
            let actualDuration = duration;
            if (currentHour < 13 && currentHour + duration > 13) {
                actualDuration = 13 - currentHour;
            }
            const endHour = currentHour + actualDuration;
            
            for (let lesson of existingLessons) {
                if (lesson.date === dateStr) {
                    const lessonStart = parseInt(lesson.startTime.split(':')[0]);
                    const lessonEnd = lessonStart + lesson.duration;
                    
                    if (lesson.roomId === roomId && 
                        ((currentHour >= lessonStart && currentHour < lessonEnd) ||
                         (endHour > lessonStart && endHour <= lessonEnd) ||
                         (currentHour <= lessonStart && endHour >= lessonEnd))) {
                        canFit = false;
                        break;
                    }
                    
                    if (teacherId && lesson.teacherId === teacherId && 
                        ((currentHour >= lessonStart && currentHour < lessonEnd) ||
                         (endHour > lessonStart && endHour <= lessonEnd) ||
                         (currentHour <= lessonStart && endHour >= lessonEnd))) {
                        canFit = false;
                        break;
                    }
                }
            }
            
            if (canFit) return { hour: currentHour, duration: actualDuration };
            currentHour++;
        }
        return null;
    };

    const autoScheduleAllCourses = () => {
        const incompleteCourses = courses.filter(c => {
            const scheduled = getCourseScheduledHours(c.id);
            return scheduled < c.totalHours;
        });

        if (incompleteCourses.length === 0) {
            alert('✅ Tutti i corsi sono già  completamente calendarizzati!');
            return;
        }

        if (!window.confirm(`Vuoi calendarizzare automaticamente ${incompleteCourses.length} corsi?\n\nIl sistema ottimizzerà  giornate, docenti e aule per massimizzare l'efficienza.`)) {
            return;
        }

        const newLessons = [];
        const errors = []; // Traccia gli errori
        const courseIssues = {}; // Problemi specifici per corso
        
        // Prepara la struttura dei corsi con le loro info
        const coursesData = incompleteCourses.map(course => {
            const scheduled = getCourseScheduledHours(course.id);
            const issues = [];
            
            // Verifica problemi iniziali del corso
            if (!course.startDate || !course.endDate) {
                issues.push('❌ Date inizio/fine non configurate');
            }
            
            const startDate = new Date(course.startDate);
            const endDate = new Date(course.endDate);
            const today = new Date();
            
            if (endDate < today) {
                issues.push(`❌ Data fine corso scaduta (${endDate.toLocaleDateString('it-IT')})`);
            }
            
            if (!rooms.find(r => r.capacity >= course.numberOfStudents)) {
                issues.push(`❌ Nessuna aula disponibile con ${course.numberOfStudents} posti`);
            }
            
            if (!course.teachers || course.teachers.length === 0) {
                if (teachers.length === 0) {
                    issues.push('❌ Nessun docente disponibile nel sistema');
                }
            }
            
            if (issues.length > 0) {
                courseIssues[course.id] = issues;
            }
            
            return {
                ...course,
                remainingHours: course.totalHours - scheduled,
                currentSubjectIndex: 0,
                currentSubjectHours: 0,
                attemptedDays: 0,
                successfulDays: 0
            };
        }).filter(c => c.remainingHours > 0);

        if (coursesData.length === 0) {
            alert('Nessun corso da calendarizzare.');
            return;
        }

        // Trova la data più lontana tra tutti i corsi
        let latestEndDate = new Date(coursesData[0].endDate);
        coursesData.forEach(c => {
            const endDate = new Date(c.endDate);
            if (endDate > latestEndDate) latestEndDate = endDate;
        });

        let currentDate = new Date();
        let totalScheduledHours = 0;
        let daysProcessed = 0;
        let daysWithLessons = 0;
        const maxDays = 365;

        while (coursesData.some(c => c.remainingHours > 0) && currentDate <= latestEndDate && daysProcessed < maxDays) {
            const dayOfWeek = currentDate.getDay();
            if (dayOfWeek === 0 || dayOfWeek === 6) {
                currentDate.setDate(currentDate.getDate() + 1);
                continue;
            }
            daysProcessed++;

            const dateStr = formatDate(currentDate);
            const existingLessonsToday = [...lessons, ...newLessons].filter(l => l.date === dateStr);
            
            // Traccia le ore giornaliere per docente
            const teacherDailyHours = {};
            teachers.forEach(t => { teacherDailyHours[t.id] = 0; });
            existingLessonsToday.forEach(l => {
                if (teacherDailyHours[l.teacherId] !== undefined) {
                    teacherDailyHours[l.teacherId] += l.duration;
                }
            });

            // Trova i corsi attivi per questa data
            const activeCourses = coursesData.filter(c => {
                const start = new Date(c.startDate);
                const end = new Date(c.endDate);
                const current = new Date(dateStr);
                if (current < start || current > end) return false;
                if (c.stageStartDate && c.stageEndDate) {
                    const stageStart = new Date(c.stageStartDate);
                    const stageEnd = new Date(c.stageEndDate);
                    if (current >= stageStart && current <= stageEnd) return false;
                }
                return c.remainingHours > 0;
            });

            if (activeCourses.length === 0) {
                currentDate.setDate(currentDate.getDate() + 1);
                continue;
            }
            
            activeCourses.forEach(c => c.attemptedDays++);

            // Prova a riempire la giornata 9-13 e 14-18
            let currentHour = 9;
            let lessonsCreatedToday = 0;

while (currentHour < 18 && activeCourses.some(c => c.remainingHours > 0)) {
                if (currentHour === 13) {
                    currentHour = 14;
                    continue;
                }

                // NUOVA LOGICA: Riempie TUTTE le aule disponibili in questa fascia oraria
                let canCreateMoreInThisSlot = true;
                
                while (canCreateMoreInThisSlot && activeCourses.some(c => c.remainingHours > 0)) {
                    canCreateMoreInThisSlot = false;
                    
                    // Prova TUTTI i corsi per questa fascia oraria
                    for (let course of activeCourses) {
                        if (course.remainingHours <= 0) continue;

                        // Verifica limite giornaliero del corso
                        const courseHoursToday = existingLessonsToday
                            .filter(l => l.courseId === course.id)
                            .reduce((sum, l) => sum + l.duration, 0);
                        
                        if (courseHoursToday >= course.maxDailyHours) continue;

                        // BUGFIX v3.0.3: Verifica che il corso NON sia già presente in questa fascia oraria
                        const courseAlreadyInThisSlot = existingLessonsToday.some(l => {
                            if (l.courseId !== course.id) return false;
                            const lessonStart = parseInt(l.startTime.split(':')[0]);
                            const lessonEnd = lessonStart + l.duration;
                            return currentHour >= lessonStart && currentHour < lessonEnd;
                        });
                        
                        if (courseAlreadyInThisSlot) continue; // Il corso è già calendarizzato in questa fascia oraria

                        // Trova materia corrente
                        const subjects = course.subjects.length > 0 ? course.subjects : [{name: course.name, hours: course.totalHours}];
                        if (course.currentSubjectIndex >= subjects.length) continue;
                        
                        const currentSubject = subjects[course.currentSubjectIndex];
                        const remainingSubjectHours = currentSubject.hours - course.currentSubjectHours;
                        
                        if (remainingSubjectHours <= 0) {
                            course.currentSubjectIndex++;
                            course.currentSubjectHours = 0;
                            continue;
                        }

                        // IMPORTANTE: Gestione aule assegnate vs aule libere
                        let availableRooms = [];

                        if (course.roomId) {
                            // Il corso HA un'aula assegnata - usa SOLO quella
                            const assignedRoom = rooms.find(r => r.id === course.roomId);
                            if (assignedRoom && assignedRoom.capacity >= course.numberOfStudents) {
                                // Verifica se l'aula assegnata è libera
                                const roomBusy = existingLessonsToday.some(l => {
                                    if (l.roomId !== assignedRoom.id) return false;
                                    const lessonStart = parseInt(l.startTime.split(':')[0]);
                                    const lessonEnd = lessonStart + l.duration;
                                    return currentHour >= lessonStart && currentHour < lessonEnd;
                                });
                                if (!roomBusy) {
                                    availableRooms.push(assignedRoom);
                                }
                                // IMPORTANTE: Se l'aula assegnata è occupata, NON cercare altre aule
                                // Il corso deve aspettare che la sua aula si liberi
                            }
                        } else {
                            // Il corso NON ha un'aula assegnata - usa qualsiasi aula disponibile
                            availableRooms = rooms.filter(r => {
                                if (r.capacity < course.numberOfStudents) return false;
                                
                                // Verifica se l'aula è libera in questa fascia oraria
                                const roomBusy = existingLessonsToday.some(l => {
                                    if (l.roomId !== r.id) return false;
                                    const lessonStart = parseInt(l.startTime.split(':')[0]);
                                    const lessonEnd = lessonStart + l.duration;
                                    return currentHour >= lessonStart && currentHour < lessonEnd;
                                });
                                return !roomBusy;
                            });
                        }
                        
                        if (availableRooms.length === 0) continue;
                        const room = availableRooms[0];

                        // Trova docente disponibile
                        let teachersList = [];
                        if (course.teachers && course.teachers.length > 0) {
                            teachersList = course.teachers
                                .map(ct => ({
                                    ...ct,
                                    teacher: teachers.find(t => t.id === ct.teacherId),
                                    hoursToday: teacherDailyHours[ct.teacherId] || 0
                                }))
                                .filter(ct => ct.teacher)
                                .sort((a, b) => a.hoursToday - b.hoursToday);
                        } else {
                            teachersList = teachers
                                .map(t => ({
                                    teacherId: t.id,
                                    teacher: t,
                                    hoursToday: teacherDailyHours[t.id] || 0,
                                    hours: 999999
                                }))
                                .sort((a, b) => a.hoursToday - b.hoursToday);
                        }

                        if (teachersList.length === 0) {
                            if (!courseIssues[course.id]) courseIssues[course.id] = [];
                            if (!courseIssues[course.id].includes('❌ Nessun docente configurato')) {
                                courseIssues[course.id].push('❌ Nessun docente configurato');
                            }
                            continue;
                        }

                        // Calcola durata ottimale
                        const remainingBeforeLunch = currentHour < 13 ? 13 - currentHour : 999;
                        const remainingInDay = currentHour < 13 ? 13 - currentHour : 18 - currentHour;
                        const remainingForCourseToday = course.maxDailyHours - courseHoursToday;
                        
                        let lessonDuration = Math.min(
                            course.maxConsecutiveHours,
                            remainingSubjectHours,
                            course.remainingHours,
                            remainingForCourseToday,
                            remainingBeforeLunch,
                            remainingInDay
                        );

                        if (lessonDuration < 1) continue;

                        // Cerca docente disponibile
                        let selectedTeacher = null;
                        for (let ct of teachersList) {
                            const teacherHoursScheduled = existingLessonsToday
                                .filter(l => l.teacherId === ct.teacherId)
                                .reduce((sum, l) => sum + l.duration, 0);
                            
                            if (teacherHoursScheduled >= 8) continue;

                            const startTimeStr = `${currentHour.toString().padStart(2, '0')}:00`;
                            if (!isTeacherAvailable(ct.teacherId, dateStr, startTimeStr)) continue;

                            const slot = findNextAvailableSlot(dateStr, currentHour, lessonDuration, room.id, ct.teacherId, existingLessonsToday);
                            if (slot && slot.hour === currentHour) {
                                selectedTeacher = ct.teacher;
                                lessonDuration = slot.duration;
                                break;
                            }
                        }

                        if (!selectedTeacher) continue;

                        // Crea la lezione
                        const tempLesson = {
                            teacherId: selectedTeacher.id,
                            roomId: room.id,
                            date: dateStr,
                            dayOfWeek: italianDays[currentDate.getDay()],
                            startTime: `${currentHour.toString().padStart(2, '0')}:00`,
                            duration: lessonDuration,
                            subject: currentSubject.name,
                            courseId: course.id,
                            numberOfStudents: course.numberOfStudents
                        };

                        const conflict = checkConflict(tempLesson, existingLessonsToday);
                        if (!conflict) {
                            newLessons.push({
                                id: Date.now() + newLessons.length + Math.random(),
                                ...tempLesson
                            });
                            
                            existingLessonsToday.push(tempLesson);
                            course.remainingHours -= lessonDuration;
                            course.currentSubjectHours += lessonDuration;
                            teacherDailyHours[selectedTeacher.id] += lessonDuration;
                            totalScheduledHours += lessonDuration;
                            lessonsCreatedToday++;

                            if (course.currentSubjectHours >= currentSubject.hours) {
                                course.currentSubjectIndex++;
                                course.currentSubjectHours = 0;
                            }

                            // IMPORTANTE: NON incrementare currentHour qui!
                            // Continua a provare altri corsi nella STESSA fascia oraria
                            canCreateMoreInThisSlot = true;
                        }
                    }
                }

                // Solo ora passa alla prossima fascia oraria
                currentHour++;
            }
            
            if (lessonsCreatedToday > 0) {
                daysWithLessons++;
                activeCourses.forEach(c => {
                    const created = existingLessonsToday.filter(l => l.courseId === c.id).length;
                    if (created > 0) c.successfulDays++;
                });
            }

            currentDate.setDate(currentDate.getDate() + 1);
        }

        if (newLessons.length > 0) {
            setLessons([...lessons, ...newLessons]);
            
            const completedCourses = coursesData.filter(c => c.remainingHours <= 0);
            const partialCourses = coursesData.filter(c => c.remainingHours > 0);
            
            let message = `✅ Calendarizzazione globale completata!\n\n` +
                  `📚 Lezioni create: ${newLessons.length}\n` +
                  `⏱️ Ore totali programmate: ${totalScheduledHours}h\n` +
                  `✅ Corsi completati: ${completedCourses.length}\n` +
                  `📊 Corsi parziali: ${partialCourses.length}\n` +
                  `📅 Giorni utilizzati: ${daysWithLessons}/${daysProcessed}`;
            
            if (partialCourses.length > 0) {
                message += '\n\n⚠️ï¸ CORSI NON COMPLETATI:';
                partialCourses.forEach(c => {

    const clearCourseCalendar = (courseId) => {

    const autoScheduleCourse = (course) => {
        if (!course.startDate || !course.endDate) {
            alert('Il corso deve avere una data di inizio e fine');
            return;
        }

        // Calcola ore già  programmate
        const alreadyScheduled = getCourseScheduledHours(course.id);
        if (alreadyScheduled >= course.totalHours) {
            alert('⚠️ï¸ Il corso è già  completamente calendarizzato!');
            return;
        }

        const newLessons = [];
        const startDate = new Date(course.startDate);
        const endDate = new Date(course.endDate);
        const stageStart = course.stageStartDate ? new Date(course.stageStartDate) : null;
        const stageEnd = course.stageEndDate ? new Date(course.stageEndDate) : null;

        let currentDate = new Date(startDate);
        let totalScheduledHours = alreadyScheduled; // IMPORTANTE: Inizia dalle ore già  programmate
        let subjectIndex = 0;
        let currentSubjectHours = 0;

        const subjects = course.subjects.length > 0 ? course.subjects : [{name: course.name, hours: course.totalHours}];

        while (totalScheduledHours < course.totalHours && currentDate <= endDate) {
            const dayOfWeek = currentDate.getDay();
            if (dayOfWeek === 0 || dayOfWeek === 6) {
                currentDate.setDate(currentDate.getDate() + 1);
                continue;
            }

            if (stageStart && stageEnd && currentDate >= stageStart && currentDate <= stageEnd) {
                currentDate.setDate(currentDate.getDate() + 1);
                continue;
            }

            if (subjectIndex >= subjects.length) break;
            
            const currentSubject = subjects[subjectIndex];
            
            // PRIORITÀ: Se il corso ha un'aula assegnata, usa quella
            let room = null;
            if (course.roomId) {
                const assignedRoom = rooms.find(r => r.id === course.roomId);
                if (assignedRoom && assignedRoom.capacity >= course.numberOfStudents) {
                    room = assignedRoom;
                }
            }
            
            // Se non ha aula assegnata o l'aula assegnata non è adatta, cerca qualsiasi aula disponibile
            if (!room) {
                room = rooms.find(r => r.capacity >= course.numberOfStudents);
            }

            if (!room) {
                alert(`ERRORE: Nessuna aula disponibile con almeno ${course.numberOfStudents} posti.`);
                break;
            }

            const dateStr = formatDate(currentDate);
            const existingLessonsToday = [...lessons, ...newLessons];
            
            const teacherHoursScheduled = {};
            if (course.teachers && course.teachers.length > 0) {
                course.teachers.forEach(ct => {
                    teacherHoursScheduled[ct.teacherId] = 0;
                });
                
                existingLessonsToday.forEach(lesson => {
                    if (lesson.courseId === course.id && teacherHoursScheduled[lesson.teacherId] !== undefined) {
                        teacherHoursScheduled[lesson.teacherId] += lesson.duration;
                    }
                });
            }
            
            let currentHour = 9;
            let hoursScheduledToday = 0;
            // IMPORTANTE: Considera le ore rimanenti del corso
            const remainingCourseHours = course.totalHours - totalScheduledHours;
            const maxHoursToday = Math.min(course.maxDailyHours, remainingCourseHours);
            
            while (hoursScheduledToday < maxHoursToday && currentHour < 18 && totalScheduledHours < course.totalHours) {
                const remainingSubjectHours = currentSubject.hours - currentSubjectHours;
                const remainingTodayHours = maxHoursToday - hoursScheduledToday;
                const remainingBeforeLunch = currentHour < 13 ? 13 - currentHour : 0;
                const stillNeeded = course.totalHours - totalScheduledHours; // Ore ancora necessarie
                
                let lessonDuration = Math.min(
                    course.maxConsecutiveHours,
                    remainingSubjectHours,
                    remainingTodayHours,
                    stillNeeded // IMPORTANTE: Non superare mai le ore totali
                );
                
                if (currentHour < 13 && remainingBeforeLunch > 0) {
                    lessonDuration = Math.min(lessonDuration, remainingBeforeLunch);
                }
                
                if (lessonDuration <= 0) {
                    if (currentHour < 13) {
                        currentHour = 14;
                    } else {
                        break;
                    }
                    continue;
                }
                
                let selectedTeacher = null;
                if (course.teachers && course.teachers.length > 0) {
                    // Usa solo i docenti specificati nel corso
                    for (let courseTeacher of course.teachers) {
                        const scheduledForThisTeacher = teacherHoursScheduled[courseTeacher.teacherId] || 0;
                        if (scheduledForThisTeacher >= courseTeacher.hours) continue;
                        
                        // NUOVO: Verifica disponibilità  del docente per questo giorno/ora
                        const startTimeStr = `${currentHour.toString().padStart(2, '0')}:00`;
                        if (!isTeacherAvailable(courseTeacher.teacherId, dateStr, startTimeStr)) {
                            continue; // Salta questo docente se non disponibile
                        }
                        
                        const slot = findNextAvailableSlot(dateStr, currentHour, lessonDuration, room.id, courseTeacher.teacherId, existingLessonsToday);
                        if (slot && slot.hour === currentHour) {
                            selectedTeacher = teachers.find(t => t.id === courseTeacher.teacherId);
                            lessonDuration = slot.duration;
                            break;
                        }
                    }
                } else {
                    // IMPORTANTE: Se non specificato, prova TUTTI i docenti disponibili
                    // Ordina per ore già  programmate oggi (chi ha fatto meno ore ha priorità )
                    const availableTeachers = teachers
                        .map(t => ({
                            teacher: t,
                            hoursToday: existingLessonsToday
                                .filter(l => l.teacherId === t.id)
                                .reduce((sum, l) => sum + l.duration, 0)
                        }))
                        .sort((a, b) => a.hoursToday - b.hoursToday);
                    
                    // Prova ogni docente fino a trovarne uno disponibile
                    for (let {teacher} of availableTeachers) {
                        // NUOVO: Verifica disponibilità  del docente per questo giorno/ora
                        const startTimeStr = `${currentHour.toString().padStart(2, '0')}:00`;
                        if (!isTeacherAvailable(teacher.id, dateStr, startTimeStr)) {
                            continue; // Salta questo docente se non disponibile
                        }
                        
                        const slot = findNextAvailableSlot(dateStr, currentHour, lessonDuration, room.id, teacher.id, existingLessonsToday);
                        if (slot && slot.hour === currentHour) {
                            selectedTeacher = teacher;
                            lessonDuration = slot.duration;
                            break; // Trovato docente disponibile
                        }
                    }
                }
                
                if (!selectedTeacher) {
                    currentHour++;
                    if (currentHour === 13) currentHour = 14;
                    continue;
                }
                
                const tempLesson = {
                    teacherId: selectedTeacher.id,
                    roomId: room.id,
                    date: dateStr,
                    dayOfWeek: italianDays[currentDate.getDay()],
                    startTime: `${currentHour.toString().padStart(2, '0')}:00`,
                    duration: lessonDuration,
                    subject: currentSubject.name,
                    courseId: course.id,
                    numberOfStudents: course.numberOfStudents
                };

                const conflict = checkConflict(tempLesson, existingLessonsToday);
                if (!conflict) {
                    newLessons.push({
                        id: Date.now() + newLessons.length,
                        ...tempLesson
                    });
                    
                    hoursScheduledToday += lessonDuration;
                    totalScheduledHours += lessonDuration;
                    currentSubjectHours += lessonDuration;
                    
                    if (teacherHoursScheduled[selectedTeacher.id] !== undefined) {
                        teacherHoursScheduled[selectedTeacher.id] += lessonDuration;
                    }
                    
                    if (currentSubjectHours >= currentSubject.hours) {
                        subjectIndex++;
                        currentSubjectHours = 0;
                        if (subjectIndex >= subjects.length) break;
                    }
                }
                
                currentHour += lessonDuration;
                if (currentHour === 13) currentHour = 14;
            }

            currentDate.setDate(currentDate.getDate() + 1);
        }

        if (newLessons.length > 0) {
            const newTotal = totalScheduledHours - alreadyScheduled;
            setLessons([...lessons, ...newLessons]);
            alert(`✅ Corso calendarizzato! Create ${newLessons.length} lezioni per ${newTotal}h.\nTotale: ${totalScheduledHours}h/${course.totalHours}h (${((totalScheduledHours/course.totalHours)*100).toFixed(1)}%)`);
        } else {
            alert('❌ Impossibile calendarizzare il corso.');
        }
    };

                        </div>

                        {showAddTeacher && (
                            <div className="bg-gray-50 p-4 rounded-lg mb-6 border-2 border-green-300">
                                <h3 className="font-bold mb-4">Nuovo Insegnante</h3>
                                <div className="space-y-3">
                                    <input type="text" value={newTeacher.name} onChange={(e) => setNewTeacher({...newTeacher, name: e.target.value})} placeholder="Nome completo" className="w-full p-2 border rounded"/>
                                    <input type="email" value={newTeacher.email} onChange={(e) => setNewTeacher({...newTeacher, email: e.target.value})} placeholder="Email" className="w-full p-2 border rounded"/>
                                    <input type="text" value={newTeacher.subject} onChange={(e) => setNewTeacher({...newTeacher, subject: e.target.value})} placeholder="Materia" className="w-full p-2 border rounded"/>
                                    <div className="flex gap-2">
                                        <button onClick={addTeacher} className="px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700">Salva</button>
                                        <button onClick={() => setShowAddTeacher(false)} className="px-4 py-2 bg-gray-400 text-white rounded hover:bg-gray-500">Annulla</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {showEditTeacher && editingTeacher && (
                            <div className="bg-blue-50 p-4 rounded-lg mb-6 border-2 border-blue-300">
                                <h3 className="font-bold mb-4">Modifica Insegnante</h3>
                                <div className="space-y-3 mb-4">
                                    <input type="text" value={editingTeacher.name} onChange={(e) => setEditingTeacher({...editingTeacher, name: e.target.value})} className="w-full p-2 border rounded"/>
                                    <input type="email" value={editingTeacher.email} onChange={(e) => setEditingTeacher({...editingTeacher, email: e.target.value})} className="w-full p-2 border rounded"/>
                                    <input type="text" value={editingTeacher.subject} onChange={(e) => setEditingTeacher({...editingTeacher, subject: e.target.value})} className="w-full p-2 border rounded"/>
                                </div>
                                
                                <UnavailabilityManager 
                                    teacher={editingTeacher} 
                                    onUpdate={(updated) => setEditingTeacher(updated)}
                                />

                                <div className="flex gap-2 mt-4">
                                    <button onClick={updateTeacher} className="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Aggiorna</button>
                                    <button onClick={() => {setShowEditTeacher(false); setEditingTeacher(null);}} className="px-4 py-2 bg-gray-400 text-white rounded hover:bg-gray-500">Annulla</button>
                                </div>
                            </div>
                        )}

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            {teachers.map(teacher => {
                                const hasUnavailability = (teacher.unavailability || []).length > 0;
                                const unavailCount = (teacher.unavailability || []).reduce((sum, u) => {
                                    // Se è un giorno intero bloccato, conta come 1
                                    if (!u.timeSlots || u.timeSlots.length === 0) return sum + 1;
                                    // Altrimenti conta le fasce orarie
                                    return sum + u.timeSlots.length;
                                }, 0);
                                
                                return (
                                    <div key={teacher.id} className="border-2 rounded-lg p-4 hover:shadow-lg transition">
                                        <div className="mb-4">
                                            <h3 className="font-bold text-lg">{teacher.name}</h3>
                                            <p className="text-gray-600">{teacher.subject}</p>
                                            <p className="text-sm text-gray-500">{teacher.email}</p>
                                            {hasUnavailability && (
                                                <div className="mt-2 inline-flex items-center gap-1 px-2 py-1 bg-yellow-100 text-yellow-800 rounded text-xs">
                                                    <ClockIcon />
                                                    {unavailCount} indisponibilità 
                                                </div>
                                            )}
                                        </div>
                                        <div className="flex gap-2 pt-4 border-t">
                                            <button onClick={() => { setEditingTeacher({...teacher}); setShowEditTeacher(true); }} className="flex-1 px-3 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 flex items-center justify-center gap-2"><EditIcon />Modifica</button>
                                            <button onClick={() => deleteTeacher(teacher.id)} className="flex-1 px-3 py-2 bg-red-600 text-white rounded hover:bg-red-700 flex items-center justify-center gap-2"><Trash2Icon />Elimina</button>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                )}

                {activeTab === 'rooms' && (
                    <div className="bg-white rounded-lg shadow p-6">
                        <div className="flex justify-between items-center mb-6">
                            <h2 className="text-2xl font-bold text-gray-800">🏫 Gestione Aule</h2>
                            <button onClick={() => setShowAddRoom(true)} className="flex items-center gap-2 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                                <PlusIcon />Aggiungi
                            </button>
                        </div>

                        {showAddRoom && (
                            <div className="bg-gray-50 p-4 rounded-lg mb-6 border-2 border-green-300">
                                <h3 className="font-bold mb-4">Nuova Aula</h3>
                                <div className="grid grid-cols-2 gap-4">
                                    <input type="text" value={newRoom.name} onChange={(e) => setNewRoom({...newRoom, name: e.target.value})} placeholder="Nome" className="p-2 border rounded"/>
                                    <input type="number" min="1" max="100" value={newRoom.capacity} onChange={(e) => setNewRoom({...newRoom, capacity: e.target.value})} placeholder="Posti" className="p-2 border rounded"/>
                                    <select value={newRoom.type} onChange={(e) => setNewRoom({...newRoom, type: e.target.value})} className="p-2 border rounded">
                                        <option value="Informatica">Informatica</option>
                                        <option value="Parrucchieri">Parrucchieri</option>
                                        <option value="Didattica">Didattica</option>
                                        <option value="Laboratorio">Laboratorio</option>
                                    </select>
                                    <label className="flex items-center gap-2 p-2 border rounded bg-white cursor-pointer">
                                        <input type="checkbox" checked={newRoom.hasProjector} onChange={(e) => setNewRoom({...newRoom, hasProjector: e.target.checked})} className="w-4 h-4"/>
                                        <span>Proiettore</span>
                                    </label>
                                </div>
                                <div className="flex gap-2 mt-4">
                                    <button onClick={addRoom} className="px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700">Salva</button>
                                    <button onClick={() => setShowAddRoom(false)} className="px-4 py-2 bg-gray-400 text-white rounded hover:bg-gray-500">Annulla</button>
                                </div>
                            </div>
                        )}

                        {showEditRoom && editingRoom && (
                            <div className="bg-blue-50 p-4 rounded-lg mb-6 border-2 border-blue-300">
                                <h3 className="font-bold mb-4">Modifica Aula</h3>
                                <div className="grid grid-cols-2 gap-4">
                                    <input type="text" value={editingRoom.name} onChange={(e) => setEditingRoom({...editingRoom, name: e.target.value})} className="p-2 border rounded"/>
                                    <input type="number" min="1" max="100" value={editingRoom.capacity} onChange={(e) => setEditingRoom({...editingRoom, capacity: e.target.value})} className="p-2 border rounded"/>
                                    <select value={editingRoom.type} onChange={(e) => setEditingRoom({...editingRoom, type: e.target.value})} className="p-2 border rounded">
                                        <option value="Informatica">Informatica</option>
                                        <option value="Parrucchieri">Parrucchieri</option>
                                        <option value="Didattica">Didattica</option>
                                        <option value="Laboratorio">Laboratorio</option>
                                    </select>
                                    <label className="flex items-center gap-2 p-2 border rounded bg-white cursor-pointer">
                                        <input type="checkbox" checked={editingRoom.hasProjector} onChange={(e) => setEditingRoom({...editingRoom, hasProjector: e.target.checked})} className="w-4 h-4"/>
                                        <span>Proiettore</span>
                                    </label>
                                </div>
                                <div className="flex gap-2 mt-4">
                                    <button onClick={updateRoom} className="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Aggiorna</button>
                                    <button onClick={() => {setShowEditRoom(false); setEditingRoom(null);}} className="px-4 py-2 bg-gray-400 text-white rounded hover:bg-gray-500">Annulla</button>
                                </div>
                            </div>
                        )}

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            {rooms.map(room => (
                                <div key={room.id} className="border-2 rounded-lg p-6 hover:shadow-lg transition">
                                    <div className="flex items-start justify-between mb-4">
                                        <div className="flex-1">
                                            <h3 className="text-xl font-bold text-gray-800">{room.name}</h3>
                                            <div className="flex items-center gap-2 mt-1">
                                                <span className="text-sm px-2 py-1 bg-gray-200 rounded">{room.type}</span>
                                                {room.hasProjector && <span className="text-sm px-2 py-1 bg-green-100 text-green-800 rounded">🎥 Proiettore</span>}
                                            </div>
                                        </div>
                                        <div className="bg-blue-100 px-3 py-1 rounded-full">
                                            <span className="font-semibold text-blue-800">{room.capacity}</span>
                                        </div>
                                    </div>
                                    <div className="flex gap-2 pt-4 border-t">
                                        <button onClick={() => { setEditingRoom({...room}); setShowEditRoom(true); }} className="flex-1 px-3 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 flex items-center justify-center gap-2"><EditIcon />Modifica</button>
                                        <button onClick={() => deleteRoom(room.id)} className="flex-1 px-3 py-2 bg-red-600 text-white rounded hover:bg-red-700 flex items-center justify-center gap-2"><Trash2Icon />Elimina</button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                )}
            </div>
        </div>
    );
};

ReactDOM.render(<SchoolScheduleManager />, document.getElementById('root'));
    </script>
</body>
</html>
