<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Gestione Aule e Calendari</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        .calendar-day { min-height: 120px; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
    const { useState } = React;

// ICONE
const CalendarIcon = () => (<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>);
const UsersIcon = () => (<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>);
const MapPinIcon = () => (<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>);
const CourseIcon = () => (<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>);
const PlusIcon = () => (<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>);
const Trash2Icon = () => (<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 4 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>);
const EditIcon = () => (<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>);
const FileTextIcon = () => (<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>);
const DownloadIcon = () => (<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>);

const SchoolScheduleManager = () => {
    const [activeTab, setActiveTab] = useState('dashboard');
    const [teachers, setTeachers] = useState([
        { id: 1, name: 'Prof. Rossi Mario', email: 'rossi@scuola.it', subject: 'Informatica' },
        { id: 2, name: 'Prof.ssa Bianchi Laura', email: 'bianchi@scuola.it', subject: 'Parrucchiere' }
    ]);
    const [rooms, setRooms] = useState([
        { id: 1, name: 'D. Calamandrei', capacity: 20, type: 'Informatica', hasProjector: true },
        { id: 2, name: 'Don L. Milani', capacity: 28, type: 'Parrucchieri', hasProjector: true },
        { id: 3, name: 'A. Turing', capacity: 25, type: 'Informatica', hasProjector: false },
        { id: 4, name: 'Aula Piccola', capacity: 8, type: 'Didattica', hasProjector: false }
    ]);
    const [lessons, setLessons] = useState([]);
    const [showAddTeacher, setShowAddTeacher] = useState(false);
    const [showAddRoom, setShowAddRoom] = useState(false);
    const [showEditRoom, setShowEditRoom] = useState(false);
    const [editingRoom, setEditingRoom] = useState(null);
    const [newTeacher, setNewTeacher] = useState({ name: '', email: '', subject: '' });
    const [newRoom, setNewRoom] = useState({ name: '', capacity: 20, type: 'Didattica', hasProjector: false });

    const addTeacher = () => {
        if (newTeacher.name && newTeacher.email) {
            setTeachers([...teachers, { ...newTeacher, id: Date.now() }]);
            setNewTeacher({ name: '', email: '', subject: '' });
            setShowAddTeacher(false);
        }
    };

    const deleteTeacher = (id) => {
        if (window.confirm('Sei sicuro?')) {
            setTeachers(teachers.filter(t => t.id !== id));
        }
    };

    const addRoom = () => {
        if (newRoom.name && newRoom.capacity) {
            setRooms([...rooms, { ...newRoom, id: Date.now(), capacity: parseInt(newRoom.capacity) }]);
            setNewRoom({ name: '', capacity: 20, type: 'Didattica', hasProjector: false });
            setShowAddRoom(false);
        }
    };

    const startEditRoom = (room) => {
        setEditingRoom({...room});
        setShowEditRoom(true);
    };

    const updateRoom = () => {
        if (editingRoom.name && editingRoom.capacity) {
            setRooms(rooms.map(r => r.id === editingRoom.id ? {...editingRoom, capacity: parseInt(editingRoom.capacity)} : r));
            setShowEditRoom(false);
            setEditingRoom(null);
        }
    };

    const deleteRoom = (id) => {
        if (window.confirm('Sei sicuro?')) {
            setRooms(rooms.filter(r => r.id !== id));
        }
    };
    return (
        <div className="min-h-screen bg-gray-50 p-6">
            <div className="max-w-7xl mx-auto">
                <div className="bg-white rounded-lg shadow-lg p-6 mb-6">
                    <h1 className="text-3xl font-bold text-gray-800 mb-2">Sistema Gestione Aule e Calendari</h1>
                    <p className="text-gray-600">Gestione completa delle aule e dei calendari degli insegnanti</p>
                </div>

                <div className="flex gap-4 mb-6 flex-wrap">
                    <button onClick={() => setActiveTab('dashboard')} className={`px-6 py-3 rounded-lg font-semibold flex items-center gap-2 ${activeTab === 'dashboard' ? 'bg-blue-600 text-white' : 'bg-white text-gray-700'}`}>
                        <CalendarIcon />Dashboard
                    </button>
                    <button onClick={() => setActiveTab('courses')} className={`px-6 py-3 rounded-lg font-semibold flex items-center gap-2 ${activeTab === 'courses' ? 'bg-blue-600 text-white' : 'bg-white text-gray-700'}`}>
                        <CourseIcon />Corsi
                    </button>
                    <button onClick={() => setActiveTab('teachers')} className={`px-6 py-3 rounded-lg font-semibold flex items-center gap-2 ${activeTab === 'teachers' ? 'bg-blue-600 text-white' : 'bg-white text-gray-700'}`}>
                        <UsersIcon />Insegnanti
                    </button>
                    <button onClick={() => setActiveTab('rooms')} className={`px-6 py-3 rounded-lg font-semibold flex items-center gap-2 ${activeTab === 'rooms' ? 'bg-blue-600 text-white' : 'bg-white text-gray-700'}`}>
                        <MapPinIcon />Aule
                    </button>
                </div>

                {activeTab === 'dashboard' && (
                    <div className="bg-white rounded-lg shadow p-6">
                        <h2 className="text-2xl font-bold mb-4">Dashboard</h2>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                            <div className="border-2 border-blue-500 rounded-lg p-6 text-center">
                                <div className="text-4xl font-bold text-blue-600">{teachers.length}</div>
                                <div className="text-gray-600 mt-2">Insegnanti</div>
                            </div>
                            <div className="border-2 border-green-500 rounded-lg p-6 text-center">
                                <div className="text-4xl font-bold text-green-600">{rooms.length}</div>
                                <div className="text-gray-600 mt-2">Aule</div>
                            </div>
                            <div className="border-2 border-purple-500 rounded-lg p-6 text-center">
                                <div className="text-4xl font-bold text-purple-600">{lessons.length}</div>
                                <div className="text-gray-600 mt-2">Lezioni</div>
                            </div>
                        </div>
                    </div>
                )}

                {activeTab === 'courses' && (
                    <div className="bg-white rounded-lg shadow p-6">
                        <h2 className="text-2xl font-bold mb-4">Gestione Corsi</h2>
                        <p className="text-gray-600">Funzionalità corsi in sviluppo. Usa la sezione Insegnanti e Aule per ora.</p>
                    </div>
                )}

                {activeTab === 'teachers' && (
                    <div className="bg-white rounded-lg shadow p-6">
                        <div className="flex justify-between items-center mb-6">
                            <h2 className="text-2xl font-bold text-gray-800">Gestione Insegnanti</h2>
                            <button onClick={() => setShowAddTeacher(true)} className="flex items-center gap-2 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                                <PlusIcon />Aggiungi Insegnante
                            </button>
                        </div>

                        {showAddTeacher && (
                            <div className="bg-gray-50 p-4 rounded-lg mb-6">
                                <h3 className="font-bold mb-4">Nuovo Insegnante</h3>
                                <div className="space-y-3">
                                    <input type="text" value={newTeacher.name} onChange={(e) => setNewTeacher({...newTeacher, name: e.target.value})} placeholder="Nome completo" className="w-full p-2 border rounded"/>
                                    <input type="email" value={newTeacher.email} onChange={(e) => setNewTeacher({...newTeacher, email: e.target.value})} placeholder="Email" className="w-full p-2 border rounded"/>
                                    <input type="text" value={newTeacher.subject} onChange={(e) => setNewTeacher({...newTeacher, subject: e.target.value})} placeholder="Materia" className="w-full p-2 border rounded"/>
                                    <div className="flex gap-2">
                                        <button onClick={addTeacher} className="px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700">Salva</button>
                                        <button onClick={() => setShowAddTeacher(false)} className="px-4 py-2 bg-gray-400 text-white rounded hover:bg-gray-500">Annulla</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            {teachers.map(teacher => (
                                <div key={teacher.id} className="border rounded-lg p-4">
                                    <div className="flex justify-between items-start">
                                        <div>
                                            <h3 className="font-bold text-lg">{teacher.name}</h3>
                                            <p className="text-gray-600">{teacher.subject}</p>
                                            <p className="text-sm text-gray-500">{teacher.email}</p>
                                        </div>
                                        <button onClick={() => deleteTeacher(teacher.id)} className="text-red-600 hover:text-red-800">
                                            <Trash2Icon />
                                        </button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                )}
                
                
                {activeTab === 'rooms' && (
                    <div className="bg-white rounded-lg shadow p-6">
                        <div className="flex justify-between items-center mb-6">
                            <h2 className="text-2xl font-bold text-gray-800">Gestione Aule</h2>
                            <button onClick={() => setShowAddRoom(true)} className="flex items-center gap-2 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                                <PlusIcon />Aggiungi Aula
                            </button>
                        </div>

                        <div className="mb-4 p-3 bg-blue-50 rounded-lg">
                            <p className="text-sm text-blue-800"><strong>Totale aule disponibili:</strong> {rooms.length}</p>
                        </div>

                        {showAddRoom && (
                            <div className="bg-gray-50 p-4 rounded-lg mb-6">
                                <h3 className="font-bold mb-4">Nuova Aula</h3>
                                <div className="grid grid-cols-2 gap-4">
                                    <input type="text" value={newRoom.name} onChange={(e) => setNewRoom({...newRoom, name: e.target.value})} placeholder="Nome aula" className="p-2 border rounded"/>
                                    <input type="number" min="1" max="100" value={newRoom.capacity} onChange={(e) => setNewRoom({...newRoom, capacity: e.target.value})} placeholder="Numero posti" className="p-2 border rounded"/>
                                    <select value={newRoom.type} onChange={(e) => setNewRoom({...newRoom, type: e.target.value})} className="p-2 border rounded">
                                        <option value="Informatica">Informatica</option>
                                        <option value="Parrucchieri">Parrucchieri</option>
                                        <option value="Didattica">Didattica</option>
                                        <option value="Laboratorio">Laboratorio</option>
                                        <option value="Aula Magna">Aula Magna</option>
                                    </select>
                                    <label className="flex items-center gap-2 p-2 border rounded bg-white cursor-pointer">
                                        <input type="checkbox" checked={newRoom.hasProjector} onChange={(e) => setNewRoom({...newRoom, hasProjector: e.target.checked})} className="w-4 h-4"/>
                                        <span>Proiettore disponibile</span>
                                    </label>
                                </div>
                                <div className="flex gap-2 mt-4">
                                    <button onClick={addRoom} className="px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700">Salva</button>
                                    <button onClick={() => setShowAddRoom(false)} className="px-4 py-2 bg-gray-400 text-white rounded hover:bg-gray-500">Annulla</button>
                                </div>
                            </div>
                        )}

                        {showEditRoom && editingRoom && (
                            <div className="bg-blue-50 p-4 rounded-lg mb-6 border-2 border-blue-300">
                                <h3 className="font-bold mb-4 text-blue-800">Modifica Aula</h3>
                                <div className="grid grid-cols-2 gap-4">
                                    <input type="text" value={editingRoom.name} onChange={(e) => setEditingRoom({...editingRoom, name: e.target.value})} placeholder="Nome aula" className="p-2 border rounded"/>
                                    <input type="number" min="1" max="100" value={editingRoom.capacity} onChange={(e) => setEditingRoom({...editingRoom, capacity: e.target.value})} placeholder="Numero posti" className="p-2 border rounded"/>
                                    <select value={editingRoom.type} onChange={(e) => setEditingRoom({...editingRoom, type: e.target.value})} className="p-2 border rounded">
                                        <option value="Informatica">Informatica</option>
                                        <option value="Parrucchieri">Parrucchieri</option>
                                        <option value="Didattica">Didattica</option>
                                        <option value="Laboratorio">Laboratorio</option>
                                        <option value="Aula Magna">Aula Magna</option>
                                    </select>
                                    <label className="flex items-center gap-2 p-2 border rounded bg-white cursor-pointer">
                                        <input type="checkbox" checked={editingRoom.hasProjector} onChange={(e) => setEditingRoom({...editingRoom, hasProjector: e.target.checked})} className="w-4 h-4"/>
                                        <span>Proiettore disponibile</span>
                                    </label>
                                </div>
                                <div className="flex gap-2 mt-4">
                                    <button onClick={updateRoom} className="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Aggiorna</button>
                                    <button onClick={() => {setShowEditRoom(false); setEditingRoom(null);}} className="px-4 py-2 bg-gray-400 text-white rounded hover:bg-gray-500">Annulla</button>
                                </div>
                            </div>
                        )}

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            {rooms.map(room => (
                                <div key={room.id} className="border-2 rounded-lg p-6 hover:border-blue-500 transition">
                                    <div className="flex items-start justify-between mb-4">
                                        <div className="flex-1">
                                            <h3 className="text-xl font-bold text-gray-800">{room.name}</h3>
                                            <div className="flex items-center gap-2 mt-1">
                                                <span className="text-sm px-2 py-1 bg-gray-200 rounded">{room.type}</span>
                                                {room.hasProjector && (
                                                    <span className="text-sm px-2 py-1 bg-green-100 text-green-800 rounded">📽️ Proiettore</span>
                                                )}
                                            </div>
                                        </div>
                                        <div className="bg-blue-100 px-3 py-1 rounded-full">
                                            <span className="font-semibold text-blue-800">{room.capacity} posti</span>
                                        </div>
                                    </div>
                                    <div className="flex gap-2 pt-4 border-t">
                                        <button onClick={() => startEditRoom(room)} className="flex-1 flex items-center justify-center gap-2 px-3 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">
                                            <EditIcon />Modifica
                                        </button>
                                        <button onClick={() => deleteRoom(room.id)} className="flex-1 flex items-center justify-center gap-2 px-3 py-2 bg-red-600 text-white rounded hover:bg-red-700">
                                            <Trash2Icon />Elimina
                                        </button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                )}
            </div>
        </div>
    );
};

ReactDOM.render(<SchoolScheduleManager />, document.getElementById('root'));
    </script>
</body>
</html>
