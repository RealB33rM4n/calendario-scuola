                                    <div className="p-3 bg-white border rounded">
                                        <label className="block text-sm font-medium mb-2">Materie insegnate:</label>
                                        {subjects.length === 0 ? (
                                            <p className="text-sm text-gray-500 italic">Nessuna materia disponibile. Vai nella sezione Materie per aggiungerne.</p>
                                        ) : (
                                            <div className="grid grid-cols-2 gap-2">
                                                {[...subjects].sort((a, b) => a.name.localeCompare(b.name)).map(subject => (
                                                    <label key={subject.id} className="flex items-center gap-2 cursor-pointer">
                                                        <input 
                                                            type="checkbox" 
                                                            checked={(newTeacher.subjectIds || []).includes(subject.id)}
                                                            onChange={() => toggleTeacherSubject(newTeacher, setNewTeacher, subject.id)}
                                                            className="w-4 h-4"
                                                        />
                                                        <span className="text-sm">{subject.name}</span>
                                                    </label>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                    
                                    <div className="flex gap-2">
                                        <button onClick={addTeacher} className="px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700">Salva</button>
                                        <button onClick={() => setShowAddTeacher(false)} className="px-4 py-2 bg-gray-400 text-white rounded hover:bg-gray-500">Annulla</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            {teachers.map(teacher => {
                                const hasUnavailability = (teacher.unavailability || []).length > 0;
                                const unavailCount = (teacher.unavailability || []).reduce((sum, u) => {
                                    if (!u.timeSlots || u.timeSlots.length === 0) return sum + 1;
                                    return sum + u.timeSlots.length;
                                }, 0);
                                
                                const teacherSubjects = (teacher.subjectIds || [])
                                    .map(sid => subjects.find(s => s.id === sid))
                                    .filter(Boolean);
                                
                                return (
                                    <React.Fragment key={teacher.id}>
                                        <div className="border-2 rounded-lg p-4 hover:shadow-lg transition">
                                        <div className="mb-4">
                                            <h3 className="font-bold text-lg">{teacher.name}</h3>
                                            <p className="text-sm text-gray-500">{teacher.email}</p>
                                            <div className="mt-2 flex flex-wrap gap-1">
                                                {teacherSubjects.length > 0 ? (
                                                    teacherSubjects.map(subject => (
                                                        <span key={subject.id} className="inline-block px-2 py-1 bg-blue-100 text-blue-800 rounded text-xs font-semibold">
                                                            {subject.name}
                                                        </span>
                                                    ))
                                                ) : (
                                                    <span className="text-xs text-gray-400 italic">Nessuna materia assegnata</span>
                                                )}
                                            </div>
                                            {hasUnavailability && (
                                                <div className="mt-2 inline-flex items-center gap-1 px-2 py-1 bg-yellow-100 text-yellow-800 rounded text-xs">
                                                    <ClockIcon />
                                                    {unavailCount} indisponibilità
                                                </div>
                                            )}
                                        </div>
                                        <div className="flex gap-2 pt-4 border-t">
                                            <button onClick={() => { setEditingTeacher({...teacher}); setShowEditTeacher(true); }} className="flex-1 px-3 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 flex items-center justify-center gap-2"><EditIcon />Modifica</button>
                                            <button onClick={() => deleteTeacher(teacher.id)} className="flex-1 px-3 py-2 bg-red-600 text-white rounded hover:bg-red-700 flex items-center justify-center gap-2"><Trash2Icon />Elimina</button>
                                        </div>
                                    </div>
                                    
                                    {editingTeacher && editingTeacher.id === teacher.id && (
                                        <div className="bg-blue-50 p-4 rounded-lg mt-4 border-2 border-blue-300">
                                            <h3 className="font-bold mb-4">✏️ Modifica Insegnante</h3>
                                            <div className="space-y-3 mb-4">
                                                <input type="text" value={editingTeacher.name} onChange={(e) => setEditingTeacher({...editingTeacher, name: e.target.value})} className="w-full p-2 border rounded"/>
                                                <input type="email" value={editingTeacher.email} onChange={(e) => setEditingTeacher({...editingTeacher, email: e.target.value})} className="w-full p-2 border rounded"/>
                                                
                                                <div className="p-3 bg-white border rounded">
                                                    <label className="block text-sm font-medium mb-2">Materie insegnate:</label>
                                                    {subjects.length === 0 ? (
                                                        <p className="text-sm text-gray-500 italic">Nessuna materia disponibile. Vai nella sezione Materie per aggiungerne.</p>
                                                    ) : (
                                                        <div className="grid grid-cols-2 gap-2">
                                                            {[...subjects].sort((a, b) => a.name.localeCompare(b.name)).map(subject => (
                                                                <label key={subject.id} className="flex items-center gap-2 cursor-pointer">
                                                                    <input 
                                                                        type="checkbox" 
                                                                        checked={(editingTeacher.subjectIds || []).includes(subject.id)}
                                                                        onChange={() => toggleTeacherSubject(editingTeacher, setEditingTeacher, subject.id)}
                                                                        className="w-4 h-4"
                                                                    />
                                                                    <span className="text-sm">{subject.name}</span>
                                                                </label>
                                                            ))}
                                                        </div>
                                                    )}
                                                </div>
                                            </div>
                                            
                                            <UnavailabilityManager 
                                                teacher={editingTeacher} 
                                                onUpdate={(updated) => setEditingTeacher(updated)}
                                            />

                                            <div className="flex gap-2 mt-4">
                                                <button onClick={updateTeacher} className="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Aggiorna</button>
                                                <button onClick={() => {setShowEditTeacher(false); setEditingTeacher(null);}} className="px-4 py-2 bg-gray-400 text-white rounded hover:bg-gray-500">Annulla</button>
                                            </div>
                                        </div>
                                    )}
                                    </React.Fragment>
                                );
                            })}
                        </div>
                    </div>
                )}

                {activeTab === 'subjects' && (
                    <div className="bg-white rounded-lg shadow p-6">
                        <div className="flex justify-between items-center mb-6">
                            <h2 className="text-2xl font-bold text-gray-800">📚 Gestione Materie</h2>
                            <button onClick={() => setShowAddSubject(true)} className="flex items-center gap-2 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                                <PlusIcon />Aggiungi
                            </button>
                        </div>

                        <div className="mb-4 p-3 bg-blue-50 rounded-lg border border-blue-200">
                            <p className="text-sm text-blue-800"><strong>💡 Info:</strong> Le materie definite qui possono essere assegnate agli insegnanti. Ogni insegnante può insegnare una o più materie.</p>
                        </div>

                        {showAddSubject && (
                            <div className="bg-gray-50 p-4 rounded-lg mb-6 border-2 border-green-300">
                                <h3 className="font-bold mb-4">Nuova Materia</h3>
                                <div className="space-y-3">
                                    <input 
                                        type="text" 
                                        value={newSubject.name} 
                                        onChange={(e) => setNewSubject({...newSubject, name: e.target.value})} 
                                        placeholder="Nome materia (es: Matematica, Informatica, ecc.)" 
                                        className="w-full p-2 border rounded"
                                    />
                                    <div className="flex gap-2">
                                        <button onClick={addSubject} className="px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700">Salva</button>
                                        <button onClick={() => setShowAddSubject(false)} className="px-4 py-2 bg-gray-400 text-white rounded hover:bg-gray-500">Annulla</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                            {subjects.length === 0 ? (
                                <div className="col-span-3 text-center py-12 text-gray-500">
                                    <p className="text-lg mb-2">Nessuna materia creata</p>
                                    <p className="text-sm">Clicca su "Aggiungi" per iniziare</p>
                                </div>
                            ) : (
                                [...subjects].sort((a, b) => a.name.localeCompare(b.name)).map(subject => {
                                    const teachersCount = teachers.filter(t => t.subjectIds && t.subjectIds.includes(subject.id)).length;
                                    
                                    return (
                                        <React.Fragment key={subject.id}>
                                            <div className="border-2 rounded-lg p-4 hover:shadow-lg transition">
                                            <div className="mb-4">
                                                <h3 className="font-bold text-lg">{subject.name}</h3>
                                                <p className="text-sm text-gray-600 mt-1">
                                                    {teachersCount === 0 ? (
                                                        <span className="text-gray-400 italic">Nessun docente assegnato</span>
                                                    ) : (
                                                        <span className="text-green-600 font-semibold">👨‍🏫 {teachersCount} docent{teachersCount === 1 ? 'e' : 'i'}</span>
                                                    )}
                                                </p>
                                            </div>
                                            <div className="flex gap-2 pt-4 border-t">
                                                <button 
                                                    onClick={() => { setEditingSubject({...subject}); setShowEditSubject(true); }} 
                                                    className="flex-1 px-3 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 flex items-center justify-center gap-2"
                                                >
                                                    <EditIcon />Modifica
                                                </button>
                                                <button 
                                                    onClick={() => deleteSubject(subject.id)} 
                                                    className="flex-1 px-3 py-2 bg-red-600 text-white rounded hover:bg-red-700 flex items-center justify-center gap-2"
                                                >
                                                    <Trash2Icon />Elimina
                                                </button>
                                            </div>
                                        </div>
                                        
                                        {editingSubject && editingSubject.id === subject.id && (
                                            <div className="bg-blue-50 p-4 rounded-lg mt-4 border-2 border-blue-300">
                                                <h3 className="font-bold mb-4">✏️ Modifica Materia</h3>
                                                <div className="space-y-3">
                                                    <input 
                                                        type="text" 
                                                        value={editingSubject.name} 
                                                        onChange={(e) => setEditingSubject({...editingSubject, name: e.target.value})} 
                                                        className="w-full p-2 border rounded"
                                                    />
                                                    <div className="flex gap-2">
                                                        <button onClick={updateSubject} className="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Aggiorna</button>
                                                        <button onClick={() => {setShowEditSubject(false); setEditingSubject(null);}} className="px-4 py-2 bg-gray-400 text-white rounded hover:bg-gray-500">Annulla</button>
                                                    </div>
                                                </div>
                                            </div>
                                        )}
                                        </React.Fragment>
                                    );
                                })
                            )}
                        </div>
                    </div>
                )}

                {activeTab === 'rooms' && (
                    <div className="bg-white rounded-lg shadow p-6">
                        <div className="flex justify-between items-center mb-6">
                            <h2 className="text-2xl font-bold text-gray-800">🏫 Gestione Aule</h2>
                            <button onClick={() => setShowAddRoom(true)} className="flex items-center gap-2 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                                <PlusIcon />Aggiungi
                            </button>
                        </div>

                        {showAddRoom && (
                            <div className="bg-gray-50 p-4 rounded-lg mb-6 border-2 border-green-300">
                                <h3 className="font-bold mb-4">Nuova Aula</h3>
                                <div className="grid grid-cols-2 gap-4">
                                    <input type="text" value={newRoom.name} onChange={(e) => setNewRoom({...newRoom, name: e.target.value})} placeholder="Nome" className="p-2 border rounded"/>
                                    <input type="number" min="1" max="100" value={newRoom.capacity} onChange={(e) => setNewRoom({...newRoom, capacity: e.target.value})} placeholder="Posti" className="p-2 border rounded"/>
                                    <select value={newRoom.type} onChange={(e) => setNewRoom({...newRoom, type: e.target.value})} className="p-2 border rounded">
                                        <option value="Informatica">Informatica</option>
                                        <option value="Parrucchieri">Parrucchieri</option>
                                        <option value="Didattica">Didattica</option>
                                        <option value="Laboratorio">Laboratorio</option>
                                    </select>
                                    <label className="flex items-center gap-2 p-2 border rounded bg-white cursor-pointer">
                                        <input type="checkbox" checked={newRoom.hasProjector} onChange={(e) => setNewRoom({...newRoom, hasProjector: e.target.checked})} className="w-4 h-4"/>
                                        <span>Proiettore</span>
                                    </label>
                                </div>
                                <div className="flex gap-2 mt-4">
                                    <button onClick={addRoom} className="px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700">Salva</button>
                                    <button onClick={() => setShowAddRoom(false)} className="px-4 py-2 bg-gray-400 text-white rounded hover:bg-gray-500">Annulla</button>
                                </div>
                            </div>
                        )}

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            {rooms.map(room => (
                                <React.Fragment key={room.id}>
                                    <div className="border-2 rounded-lg p-6 hover:shadow-lg transition">
                                    <div className="flex items-start justify-between mb-4">
                                        <div className="flex-1">
                                            <h3 className="text-xl font-bold text-gray-800">{room.name}</h3>
                                            <div className="flex items-center gap-2 mt-1">
                                                <span className="text-sm px-2 py-1 bg-gray-200 rounded">{room.type}</span>
                                                {room.hasProjector && <span className="text-sm px-2 py-1 bg-green-100 text-green-800 rounded">🎥 Proiettore</span>}
                                            </div>
                                        </div>
                                        <div className="bg-blue-100 px-3 py-1 rounded-full">
                                            <span className="font-semibold text-blue-800">{room.capacity}</span>
                                        </div>
                                    </div>
                                    <div className="flex gap-2 pt-4 border-t">
                                        <button onClick={() => { setEditingRoom({...room}); setShowEditRoom(true); }} className="flex-1 px-3 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 flex items-center justify-center gap-2"><EditIcon />Modifica</button>
                                        <button onClick={() => deleteRoom(room.id)} className="flex-1 px-3 py-2 bg-red-600 text-white rounded hover:bg-red-700 flex items-center justify-center gap-2"><Trash2Icon />Elimina</button>
                                    </div>
                                </div>
                                
                                {editingRoom && editingRoom.id === room.id && (
                                    <div className="bg-blue-50 p-4 rounded-lg mt-4 border-2 border-blue-300">
                                        <h3 className="font-bold mb-4">✏️ Modifica Aula</h3>
                                        <div className="grid grid-cols-2 gap-4">
                                            <input type="text" value={editingRoom.name} onChange={(e) => setEditingRoom({...editingRoom, name: e.target.value})} placeholder="Nome aula" className="p-2 border rounded"/>
                                            <input type="number" min="1" max="100" value={editingRoom.capacity} onChange={(e) => setEditingRoom({...editingRoom, capacity: e.target.value})} placeholder="Capienza" className="p-2 border rounded"/>
                                            <select value={editingRoom.type} onChange={(e) => setEditingRoom({...editingRoom, type: e.target.value})} className="p-2 border rounded">
                                                <option value="Informatica">Informatica</option>
                                                <option value="Parrucchieri">Parrucchieri</option>
                                                <option value="Didattica">Didattica</option>
                                                <option value="Laboratorio">Laboratorio</option>
                                            </select>
                                            <label className="flex items-center gap-2 p-2 border rounded bg-white cursor-pointer">
                                                <input type="checkbox" checked={editingRoom.hasProjector} onChange={(e) => setEditingRoom({...editingRoom, hasProjector: e.target.checked})} className="w-4 h-4"/>
                                                <span>Proiettore</span>
                                            </label>
                                        </div>
                                        <div className="flex gap-2 mt-4">
                                            <button onClick={updateRoom} className="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Aggiorna</button>
                                            <button onClick={() => {setShowEditRoom(false); setEditingRoom(null);}} className="px-4 py-2 bg-gray-400 text-white rounded hover:bg-gray-500">Annulla</button>
                                        </div>
                                    </div>
                                )}
                                </React.Fragment>
                            ))}
                        </div>
                    </div>
                )}
            </div>
        </div>
    );
};

ReactDOM.render(<SchoolScheduleManager />, document.getElementById('root'));
    </script>
</body>
</html>
