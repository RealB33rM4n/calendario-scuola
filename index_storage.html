// Default availability: Mon-Fri 9:00-18:00 (full working hours)
const DEFAULT_WORKING_SLOTS = ['09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00'];
const DEFAULT_AVAILABILITY = [1,2,3,4,5].map(day => ({
    day,
    timeSlots: [...DEFAULT_WORKING_SLOTS]
}));

// Migrazione: converte vecchi dati con `unavailability` in nuovi con `availability`
const migrateTeacherToAvailability = (teacher) => {
    if (teacher.availability) return teacher;
    
    // Se non aveva unavailability, era completamente disponibile
    if (!teacher.unavailability || teacher.unavailability.length === 0) {
        return { ...teacher, availability: DEFAULT_AVAILABILITY.map(a => ({...a, timeSlots: [...a.timeSlots]})) };
    }
    
    // Costruisci availability come complemento di unavailability
    const availability = [];
    for (let day = 1; day <= 5; day++) {
        const unavail = teacher.unavailability.find(u => u.day === day);
        if (!unavail) {
            // Nessuna indisponibilità = giorno completo disponibile
            availability.push({ day, timeSlots: [...DEFAULT_WORKING_SLOTS] });
        } else if (!unavail.timeSlots || unavail.timeSlots.length === 0) {
            // Giorno intero bloccato = non disponibile (non aggiungere)
        } else {
            // Sottrai le ore indisponibili da quelle lavorative
            const available = DEFAULT_WORKING_SLOTS.filter(s => !unavail.timeSlots.includes(s));
            if (available.length > 0) {
                availability.push({ day, timeSlots: available });
            }
        }
    }
    
    const migrated = { ...teacher, availability };
    delete migrated.unavailability;
    return migrated;
};
