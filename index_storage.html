// Dati iniziali di default

const DEFAULT_ROOMS = [

const SchoolScheduleManager = () => {
    const [activeTab, setActiveTab] = useState('dashboard');
    
    // 🔥 NUOVO: Carica dati da localStorage all'avvio
    const [subjects, setSubjects] = useState(() => {
        const saved = localStorage.getItem('nse_subjects');
        return saved ? JSON.parse(saved) : DEFAULT_SUBJECTS;
    });
    
    const [teachers, setTeachers] = useState(() => {
        const saved = localStorage.getItem('nse_teachers');
        return saved ? JSON.parse(saved) : DEFAULT_TEACHERS;
    });
    
    const [rooms, setRooms] = useState(() => {
        const saved = localStorage.getItem('nse_rooms');
        return saved ? JSON.parse(saved) : DEFAULT_ROOMS;
    });
    
    const [lessons, setLessons] = useState(() => {
        const saved = localStorage.getItem('nse_lessons');
        return saved ? JSON.parse(saved) : [];
    });
    
    const [courses, setCourses] = useState(() => {
        const saved = localStorage.getItem('nse_courses');
        return saved ? JSON.parse(saved) : [];
    });

    const [viewMode, setViewMode] = useState('week');
    const [filteredCourseIds, setFilteredCourseIds] = useState([]);
    const [courseColorMap, setCourseColorMap] = useState({});
    const [selectedDate, setSelectedDate] = useState(new Date());
    const [selectedLesson, setSelectedLesson] = useState(null);
    
    const [showAddCourse, setShowAddCourse] = useState(false);
    const [showEditCourse, setShowEditCourse] = useState(false);
    const [editingCourse, setEditingCourse] = useState(null);
    const [showAddLesson, setShowAddLesson] = useState(false);
    const [showEditLessonDetails, setShowEditLessonDetails] = useState(false);
    const [editingLesson, setEditingLesson] = useState(null);
    const [showAddTeacher, setShowAddTeacher] = useState(false);
    const [showEditTeacher, setShowEditTeacher] = useState(false);
    const [editingTeacher, setEditingTeacher] = useState(null);
    const [showAddRoom, setShowAddRoom] = useState(false);
    const [showEditRoom, setShowEditRoom] = useState(false);
    const [editingRoom, setEditingRoom] = useState(null);
    const [showAddSubject, setShowAddSubject] = useState(false);
    const [showEditSubject, setShowEditSubject] = useState(false);
    const [editingSubject, setEditingSubject] = useState(null);

    const [newCourse, setNewCourse] = useState({
        name: '', totalHours: 0, maxDailyHours: 4, maxConsecutiveHours: 4,
        startDate: '', endDate: '', teachers: [],
        stageStartDate: '', stageEndDate: '', numberOfStudents: '', roomId: ''
    });
    const [newLesson, setNewLesson] = useState({
        teacherId: '', roomId: '', date: new Date().toISOString().split('T')[0],
        startTime: '09:00', duration: 1, subject: '', numberOfStudents: '', courseId: ''
    });
    const [newTeacher, setNewTeacher] = useState({ name: '', email: '', subjectIds: [], unavailability: [] });
    const [newRoom, setNewRoom] = useState({ name: '', capacity: 20, type: 'Didattica', hasProjector: false });
    const [newSubject, setNewSubject] = useState({ name: '' });

    // 🔥 NUOVO: Salva automaticamente quando i dati cambiano
    useEffect(() => {
        localStorage.setItem('nse_subjects', JSON.stringify(subjects));
    }, [subjects]);

    useEffect(() => {
        localStorage.setItem('nse_teachers', JSON.stringify(teachers));
    }, [teachers]);

    useEffect(() => {
        localStorage.setItem('nse_rooms', JSON.stringify(rooms));
    }, [rooms]);

    useEffect(() => {
        localStorage.setItem('nse_lessons', JSON.stringify(lessons));
    }, [lessons]);

    useEffect(() => {
        localStorage.setItem('nse_courses', JSON.stringify(courses));
    }, [courses]);

    // 🔥 NUOVO: Funzioni Export/Import
    const exportData = () => {
        const data = {
            version: '3.3.8',
            exportDate: new Date().toISOString(),
            subjects,
            teachers,
            rooms,
            lessons,
            courses
        };
        
        const dataStr = JSON.stringify(data, null, 2);
        const dataBlob = new Blob([dataStr], { type: 'application/json' });
        const url = URL.createObjectURL(dataBlob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `NSE_backup_${new Date().toISOString().split('T')[0]}.json`;
        link.click();
        URL.revokeObjectURL(url);
        
        alert('✅ Dati esportati con successo!\n\n📁 File salvato come: ' + link.download);
    };

    const importData = (event) => {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                const data = JSON.parse(e.target.result);
                
                if (!data.version || !data.teachers || !data.rooms || !data.lessons || !data.courses) {
                    throw new Error('File non valido');
                }

                if (window.confirm('⚠️ ATTENZIONE!\n\nImportare i dati sovrascriverà tutti i dati attuali.\n\nContinuare?')) {
                    // Gestione retrocompatibilità: se non ci sono subjects, usa quelli di default
                    const importedSubjects = data.subjects || DEFAULT_SUBJECTS;
                    
                    // Gestione retrocompatibilità: converti teachers con subject string in subjectIds
                    const importedTeachers = data.teachers.map(t => {
                        if (t.subject && !t.subjectIds) {
                            // Trova o crea la materia
                            const existingSubject = importedSubjects.find(s => s.name === t.subject);
                            const subjectId = existingSubject ? existingSubject.id : importedSubjects.length + 1;
                            if (!existingSubject) {
                                importedSubjects.push({ id: subjectId, name: t.subject });
                            }
                            return { ...t, subjectIds: [subjectId] };
                        }
                        return t;
                    });
                    
                    setSubjects(importedSubjects);
                    setTeachers(importedTeachers);
                    setRooms(data.rooms);
                    setLessons(data.lessons);
                    setCourses(data.courses);
                    
                    alert(`✅ Dati importati con successo!\n\n📊 Statistiche:\n• ${data.courses.length} corsi\n• ${data.teachers.length} docenti\n• ${importedSubjects.length} materie\n• ${data.rooms.length} aule\n• ${data.lessons.length} lezioni\n\nData export: ${new Date(data.exportDate).toLocaleString('it-IT')}`);
                }
            } catch (error) {
                alert('❌ Errore durante l\'importazione!\n\n' + error.message);
            }
        };
        reader.readAsText(file);
        event.target.value = ''; // Reset input
    };

    const clearAllData = () => {
        if (window.confirm('⚠️ ATTENZIONE!\n\nQuesta operazione cancellerà TUTTI i dati:\n• Tutti i corsi\n• Tutte le lezioni\n• Tutti i docenti\n• Tutte le aule\n• Tutte le materie\n\nVuoi continuare?')) {
            if (window.confirm('🚨 SEI SICURO?\n\nQuesta operazione NON può essere annullata!\n\nConsigli prima di procedere:\n1. Esporta i dati come backup\n2. Conferma che vuoi davvero cancellare tutto')) {
                setSubjects(DEFAULT_SUBJECTS);
                setTeachers(DEFAULT_TEACHERS);
                setRooms(DEFAULT_ROOMS);
                setLessons([]);
                setCourses([]);
                setCourseColorMap({});
                localStorage.clear();
                alert('✅ Tutti i dati sono stati cancellati!\n\nIl sistema è stato ripristinato con i dati di default.');
            }
        }
    };

    const italianDays = ['Domenica', 'Lunedì', 'Martedì', 'Mercoledì', 'Giovedì', 'Venerdì', 'Sabato'];

    const formatDate = (date) => new Date(date).toISOString().split('T')[0];

    const getCourseColor = (courseId) => {
        if (!courseId) return COURSE_COLORS[0];
        
        // Se il corso ha già un colore assegnato, usalo
        if (courseColorMap[courseId] !== undefined) {
            return COURSE_COLORS[courseColorMap[courseId]];
        }
        
        // Trova i colori già usati
        const usedColorIndices = Object.values(courseColorMap);
        
        // Trova il primo colore disponibile (non usato)
        let availableColorIndex = -1;
        for (let i = 0; i < COURSE_COLORS.length; i++) {
            if (!usedColorIndices.includes(i)) {
                availableColorIndex = i;
                break;
            }
        }
        
        // Se tutti i colori sono usati, usa quello meno usato
        if (availableColorIndex === -1) {
            const colorCounts = {};
            usedColorIndices.forEach(idx => {
                colorCounts[idx] = (colorCounts[idx] || 0) + 1;
            });
            availableColorIndex = parseInt(Object.keys(colorCounts).reduce((a, b) => 
                colorCounts[a] < colorCounts[b] ? a : b
            ));
        }
        
        // Salva l'assegnazione
        setCourseColorMap(prev => ({...prev, [courseId]: availableColorIndex}));
        
        return COURSE_COLORS[availableColorIndex];
    };

    const navigateWeek = (direction) => {
        const newDate = new Date(selectedDate);
        newDate.setDate(newDate.getDate() + (direction * 7));
        setSelectedDate(newDate);
    };

    const navigateMonth = (direction) => {
        const newDate = new Date(selectedDate);
        newDate.setDate(1);
        newDate.setMonth(newDate.getMonth() + direction);
        setSelectedDate(newDate);
    };

    const getWeekDates = () => {
        const curr = new Date(selectedDate);
        const dayOfWeek = curr.getDay();
        const diff = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
        const monday = new Date(curr);
        monday.setDate(curr.getDate() + diff);
        const dates = [];
        for (let i = 0; i < 6; i++) {
            const date = new Date(monday);
            date.setDate(monday.getDate() + i);
            dates.push(date);
        }
        return dates;
    };
    
    // Funzioni per filtro corsi
    const toggleCourseFilter = (courseId) => {
        setFilteredCourseIds(prev => {
            if (prev.includes(courseId)) {
                return prev.filter(id => id !== courseId);
            } else {
                return [...prev, courseId];
            }
        });
    };
    
    const selectAllCourses = () => {
        setFilteredCourseIds(courses.map(c => c.id));
    };
    
    const deselectAllCourses = () => {
        setFilteredCourseIds([]);
    };
    
    const getFilteredLessons = () => {
        if (filteredCourseIds.length === 0) {
            return lessons; // Nessun filtro = mostra tutto
        }
        return lessons.filter(l => filteredCourseIds.includes(l.courseId));
    };

    const getMonthDays = () => {
        const year = selectedDate.getFullYear();
        const month = selectedDate.getMonth();
        const firstDay = new Date(year, month, 1);
        const lastDay = new Date(year, month + 1, 0);
        const daysInMonth = lastDay.getDate();
        const startDayOfWeek = firstDay.getDay() === 0 ? 6 : firstDay.getDay() - 1;
        const days = [];
        for (let i = 0; i < startDayOfWeek; i++) days.push(null);
        for (let i = 1; i <= daysInMonth; i++) days.push(new Date(year, month, i));
        return days;
    };

    const isTeacherAvailable = (teacherId, date, startTime) => {
        const teacher = teachers.find(t => t.id === teacherId);
        if (!teacher || !teacher.unavailability) return true;
        
        const dayOfWeek = new Date(date).getDay();
        
        for (const unavail of teacher.unavailability) {
            if (unavail.day === dayOfWeek && (!unavail.timeSlots || unavail.timeSlots.length === 0)) {
                return false;
            }
            
            if (unavail.day === dayOfWeek && unavail.timeSlots && unavail.timeSlots.includes(startTime)) {
                return false;
            }
        }
        
        return true;
    };

    const addUnavailability = (teacher, day, timeSlot) => {
        const unavailability = teacher.unavailability || [];
        
        if (timeSlot === null) {
            const otherDays = unavailability.filter(u => u.day !== day);
            return {
                ...teacher,
                unavailability: [...otherDays, { day, timeSlots: [] }]
            };
        }
        
        const dayUnavail = unavailability.find(u => u.day === day);
        
        if (dayUnavail) {
            if (!dayUnavail.timeSlots || dayUnavail.timeSlots.length === 0) {
                return teacher;
            }
            
            if (!dayUnavail.timeSlots.includes(timeSlot)) {
                return {
                    ...teacher,
                    unavailability: unavailability.map(u => 
                        u.day === day 
                            ? { ...u, timeSlots: [...u.timeSlots, timeSlot] }
                            : u
                    )
                };
            }
        } else {
            return {
                ...teacher,
                unavailability: [...unavailability, { day, timeSlots: [timeSlot] }]
            };
        }
        return teacher;
    };

    const removeUnavailability = (teacher, day, timeSlot) => {
        const unavailability = teacher.unavailability || [];
        
        if (timeSlot === null) {
            return {
                ...teacher,
                unavailability: unavailability.filter(u => u.day !== day)
            };
        }
        
        return {
            ...teacher,
            unavailability: unavailability.map(u => {
                if (u.day === day) {
                    const newTimeSlots = (u.timeSlots || []).filter(ts => ts !== timeSlot);
                    return { ...u, timeSlots: newTimeSlots };
                }
                return u;
            }).filter(u => u.timeSlots && u.timeSlots.length > 0)
        };
    };

    const getCourseScheduledHours = (courseId) => {
        return lessons
            .filter(l => l.courseId === courseId)
            .reduce((sum, l) => sum + l.duration, 0);
    };

    const getCourseRemainingHours = (courseId) => {
        const course = courses.find(c => c.id === courseId);
        if (!course) return 0;
        const scheduled = getCourseScheduledHours(courseId);
        const assignedHours = calculateAssignedHours(course);
        return Math.max(0, assignedHours - scheduled);
    };

    const checkConflict = (lesson, existingLessons = lessons) => {
        const room = rooms.find(r => r.id === parseInt(lesson.roomId));
        if (room && parseInt(lesson.numberOfStudents) > room.capacity) {
            return `L'aula ${room.name} ha solo ${room.capacity} posti, ma servono ${lesson.numberOfStudents} posti`;
        }
        
        const lessonStart = parseInt(lesson.startTime.split(':')[0]);
        const lessonEnd = lessonStart + parseInt(lesson.duration);
        
        for (let existing of existingLessons) {
            if (lesson.id && existing.id === lesson.id) continue;
            
            if (existing.date === lesson.date && existing.teacherId === parseInt(lesson.teacherId)) {
                const existingStart = parseInt(existing.startTime.split(':')[0]);
                const existingEnd = existingStart + existing.duration;
                
                if ((lessonStart >= existingStart && lessonStart < existingEnd) ||
                    (lessonEnd > existingStart && lessonEnd <= existingEnd) ||
                    (lessonStart <= existingStart && lessonEnd >= existingEnd)) {
                    const teacher = teachers.find(t => t.id === parseInt(lesson.teacherId));
                    return `L'insegnante ${teacher?.name} ha già una lezione dalle ${existing.startTime} alle ${existingStart + existing.duration}:00`;
                }
            }
        }
        
        return null;
    };

    const findNextAvailableSlot = (dateStr, startHour, duration, roomId, teacherId, existingLessons) => {
        let currentHour = startHour;
        while (currentHour < 18) {
            let canFit = true;
            let actualDuration = duration;
            const endHour = currentHour + actualDuration;
            
            for (let lesson of existingLessons) {
                if (lesson.date === dateStr) {
                    const lessonStart = parseInt(lesson.startTime.split(':')[0]);
                    const lessonEnd = lessonStart + lesson.duration;
                    
                    if (lesson.roomId === roomId && 
                        ((currentHour >= lessonStart && currentHour < lessonEnd) ||
                         (endHour > lessonStart && endHour <= lessonEnd) ||
                         (currentHour <= lessonStart && endHour >= lessonEnd))) {
                        canFit = false;
                        break;
                    }
                    
                    if (teacherId && lesson.teacherId === teacherId && 
                        ((currentHour >= lessonStart && currentHour < lessonEnd) ||
                         (endHour > lessonStart && endHour <= lessonEnd) ||
                         (currentHour <= lessonStart && endHour >= lessonEnd))) {
                        canFit = false;
                        break;
                    }
                }
            }
            
            if (canFit) return { hour: currentHour, duration: actualDuration };
            currentHour++;
        }
        return null;
    };

    const autoScheduleAllCourses = () => {
        const incompleteCourses = courses.filter(c => {
            const scheduled = getCourseScheduledHours(c.id);
            const assignedHours = calculateAssignedHours(c);
            return scheduled < assignedHours && assignedHours > 0;
        });

        if (incompleteCourses.length === 0) {
            alert('✅ Tutti i corsi sono già completamente calendarizzati o non hanno ore assegnate!');
            return;
        }

        if (!window.confirm(`Vuoi calendarizzare automaticamente ${incompleteCourses.length} corsi?\n\nIl sistema ottimizzerà giornate, docenti e aule per massimizzare l'efficienza.`)) {
            return;
        }

        const newLessons = [];
        const errors = [];
        const courseIssues = {};
        
        const coursesData = incompleteCourses.map(course => {
            const scheduled = getCourseScheduledHours(course.id);
            const issues = [];
            
            if (!course.startDate || !course.endDate) {
                issues.push('❌ Date inizio/fine non configurate');
            }
            
            const startDate = new Date(course.startDate);
            const endDate = new Date(course.endDate);
            const today = new Date();
            
            if (endDate < today) {
                issues.push(`❌ Data fine corso scaduta (${endDate.toLocaleDateString('it-IT')})`);
            }
            
            if (!rooms.find(r => r.capacity >= course.numberOfStudents)) {
                issues.push(`❌ Nessuna aula disponibile con ${course.numberOfStudents} posti`);
            }
            
            if (!course.teachers || course.teachers.length === 0) {
                if (teachers.length === 0) {
                    issues.push('❌ Nessun docente disponibile nel sistema');
                }
            }
            
            if (issues.length > 0) {
                courseIssues[course.id] = issues;
            }
            
            return {
                ...course,
                remainingHours: calculateAssignedHours(course) - scheduled,
                currentSubjectIndex: 0,
                currentSubjectHours: 0,
                attemptedDays: 0,
                successfulDays: 0
            };
        }).filter(c => c.remainingHours > 0);

        if (coursesData.length === 0) {
            alert('Nessun corso da calendarizzare.');
            return;
        }

        let latestEndDate = new Date(coursesData[0].endDate);
        coursesData.forEach(c => {
            const endDate = new Date(c.endDate);
            if (endDate > latestEndDate) latestEndDate = endDate;
        });

        let currentDate = new Date();
        let totalScheduledHours = 0;
        let daysProcessed = 0;
        let daysWithLessons = 0;
        const maxDays = 365;
        
        // Traccia ore totali per docente per materia per corso
        const courseTeacherSubjectHours = {};
        coursesData.forEach(course => {
            courseTeacherSubjectHours[course.id] = {};
            if (course.teachers && course.teachers.length > 0) {
                course.teachers.forEach(ct => {
                    if (!courseTeacherSubjectHours[course.id][ct.teacherId]) {
                        courseTeacherSubjectHours[course.id][ct.teacherId] = {};
                    }
                    if (ct.subjects) {
                        ct.subjects.forEach(s => {
                            courseTeacherSubjectHours[course.id][ct.teacherId][s.subjectId] = 0;
                        });
                    }
                });
                
                // Conta ore già schedulate
                lessons.filter(l => l.courseId === course.id).forEach(lesson => {
                    if (courseTeacherSubjectHours[course.id][lesson.teacherId]) {
                        const courseSubjects = getSubjectsFromTeachers(course);
                        const lessonSubject = courseSubjects.find(s => s.name === lesson.subject);
                        if (lessonSubject && courseTeacherSubjectHours[course.id][lesson.teacherId][lessonSubject.id] !== undefined) {
                            courseTeacherSubjectHours[course.id][lesson.teacherId][lessonSubject.id] += lesson.duration;
                        }
                    }
                });
            }
        });

        while (coursesData.some(c => c.remainingHours > 0) && currentDate <= latestEndDate && daysProcessed < maxDays) {
            const dayOfWeek = currentDate.getDay();
            if (dayOfWeek === 0 || dayOfWeek === 6) {
                currentDate.setDate(currentDate.getDate() + 1);
                continue;
            }
            daysProcessed++;

            const dateStr = formatDate(currentDate);
            const existingLessonsToday = [...lessons, ...newLessons].filter(l => l.date === dateStr);
            
            const teacherDailyHours = {};
            teachers.forEach(t => { teacherDailyHours[t.id] = 0; });
            existingLessonsToday.forEach(l => {
                if (teacherDailyHours[l.teacherId] !== undefined) {
                    teacherDailyHours[l.teacherId] += l.duration;
                }
            });

            const activeCourses = coursesData.filter(c => {
                const start = new Date(c.startDate);
                const end = new Date(c.endDate);
                const current = new Date(dateStr);
                if (current < start || current > end) return false;
                if (c.stageStartDate && c.stageEndDate) {
                    const stageStart = new Date(c.stageStartDate);
                    const stageEnd = new Date(c.stageEndDate);
                    if (current >= stageStart && current <= stageEnd) return false;
                }
                return c.remainingHours > 0;
            });

            if (activeCourses.length === 0) {
                currentDate.setDate(currentDate.getDate() + 1);
                continue;
            }
            
            activeCourses.forEach(c => c.attemptedDays++);

            let currentHour = 9;
            let lessonsCreatedToday = 0;

            while (currentHour < 18 && activeCourses.some(c => c.remainingHours > 0)) {
                let canCreateMoreInThisSlot = true;
                
                while (canCreateMoreInThisSlot && activeCourses.some(c => c.remainingHours > 0)) {
                    canCreateMoreInThisSlot = false;
                    
                    for (let course of activeCourses) {
                        if (course.remainingHours <= 0) continue;

                        const courseHoursToday = existingLessonsToday
                            .filter(l => l.courseId === course.id)
                            .reduce((sum, l) => sum + l.duration, 0);
                        
                        if (courseHoursToday >= course.maxDailyHours) continue;

                        const courseAlreadyInThisSlot = existingLessonsToday.some(l => {
                            if (l.courseId !== course.id) return false;
                            const lessonStart = parseInt(l.startTime.split(':')[0]);
                            const lessonEnd = lessonStart + l.duration;
                            return currentHour >= lessonStart && currentHour < lessonEnd;
                        });
                        
                        if (courseAlreadyInThisSlot) continue;

                        const courseSubjects = getSubjectsFromTeachers(course);
                        if (courseSubjects.length === 0 || course.currentSubjectIndex >= courseSubjects.length) continue;
                        
                        const currentSubject = courseSubjects[course.currentSubjectIndex];
                        const remainingSubjectHours = currentSubject.hours - course.currentSubjectHours;
                        
                        if (remainingSubjectHours <= 0) {
                            course.currentSubjectIndex++;
                            course.currentSubjectHours = 0;
                            continue;
                        }

                        let availableRooms = [];

                        if (course.roomId) {
                            const assignedRoom = rooms.find(r => r.id === course.roomId);
                            if (assignedRoom && assignedRoom.capacity >= course.numberOfStudents) {
                                const roomBusy = existingLessonsToday.some(l => {
                                    if (l.roomId !== assignedRoom.id) return false;
                                    const lessonStart = parseInt(l.startTime.split(':')[0]);
                                    const lessonEnd = lessonStart + l.duration;
                                    return currentHour >= lessonStart && currentHour < lessonEnd;
                                });
                                if (!roomBusy) {
                                    availableRooms.push(assignedRoom);
                                }
                            }
                        } else {
                            availableRooms = rooms.filter(r => {
                                if (r.capacity < course.numberOfStudents) return false;
                                
                                const roomBusy = existingLessonsToday.some(l => {
                                    if (l.roomId !== r.id) return false;
                                    const lessonStart = parseInt(l.startTime.split(':')[0]);
                                    const lessonEnd = lessonStart + l.duration;
                                    return currentHour >= lessonStart && currentHour < lessonEnd;
                                });
                                return !roomBusy;
                            });
                        }
                        
                        if (availableRooms.length === 0) continue;
                        const room = availableRooms[0];

                        let teachersList = [];
                        if (course.teachers && course.teachers.length > 0) {
                            teachersList = course.teachers
                                .map(ct => ({
                                    ...ct,
                                    teacher: teachers.find(t => t.id === ct.teacherId),
                                    hoursToday: teacherDailyHours[ct.teacherId] || 0
                                }))
                                .filter(ct => ct.teacher)
                                .sort((a, b) => a.hoursToday - b.hoursToday);
                        } else {
                            teachersList = teachers
                                .map(t => ({
                                    teacherId: t.id,
                                    teacher: t,
                                    hoursToday: teacherDailyHours[t.id] || 0,
                                    hours: 999999
                                }))
                                .sort((a, b) => a.hoursToday - b.hoursToday);
                        }

                        if (teachersList.length === 0) {
                            if (!courseIssues[course.id]) courseIssues[course.id] = [];
                            if (!courseIssues[course.id].includes('❌ Nessun docente configurato')) {
                                courseIssues[course.id].push('❌ Nessun docente configurato');
                            }
                            continue;
                        }

                        const remainingInDay = 18 - currentHour;
                        const remainingForCourseToday = course.maxDailyHours - courseHoursToday;
                        
                        let lessonDuration = Math.min(
                            course.maxConsecutiveHours,
                            remainingSubjectHours,
                            course.remainingHours,
                            remainingForCourseToday,
                            remainingInDay
                        );

                        if (lessonDuration < 1) continue;

                        let selectedTeacher = null;
                        for (let ct of teachersList) {
                            // Verifica se questo docente ha ore assegnate per la materia corrente
                            const courseTeacher = course.teachers?.find(t => t.teacherId === ct.teacherId);
                            if (courseTeacher) {
                                const teacherSubject = (courseTeacher.subjects || []).find(s => s.subjectId === currentSubject.id);
                                if (!teacherSubject || teacherSubject.hours <= 0) continue;
                                
                                // Verifica quante ore ha già fatto per questa materia
                                const hoursAlreadyDone = courseTeacherSubjectHours[course.id]?.[ct.teacherId]?.[currentSubject.id] || 0;
                                if (hoursAlreadyDone >= teacherSubject.hours) continue;
                                
                                // Limita la durata alle ore rimanenti per questo docente per questa materia
                                const remainingForTeacher = teacherSubject.hours - hoursAlreadyDone;
                                lessonDuration = Math.min(lessonDuration, remainingForTeacher);
                            }
                            
                            const teacherHoursScheduled = existingLessonsToday
                                .filter(l => l.teacherId === ct.teacherId)
                                .reduce((sum, l) => sum + l.duration, 0);
                            
                            if (teacherHoursScheduled >= 8) continue;

                            const startTimeStr = `${currentHour.toString().padStart(2, '0')}:00`;
                            if (!isTeacherAvailable(ct.teacherId, dateStr, startTimeStr)) continue;

                            const slot = findNextAvailableSlot(dateStr, currentHour, lessonDuration, room.id, ct.teacherId, existingLessonsToday);
                            if (slot && slot.hour === currentHour) {
                                selectedTeacher = ct.teacher;
                                lessonDuration = slot.duration;
                                break;
                            }
                        }

                        if (!selectedTeacher) {
                            // Verifica se tutti i docenti per questa materia hanno finito le loro ore
                            const allTeachersCompletedForSubject = course.teachers && course.teachers.every(ct => {
                                const teacherSubject = (ct.subjects || []).find(s => s.subjectId === currentSubject.id);
                                if (!teacherSubject || teacherSubject.hours <= 0) return true;
                                const hoursAlreadyDone = courseTeacherSubjectHours[course.id]?.[ct.teacherId]?.[currentSubject.id] || 0;
                                return hoursAlreadyDone >= teacherSubject.hours;
                            });
                            
                            if (allTeachersCompletedForSubject) {
                                course.currentSubjectIndex++;
                                course.currentSubjectHours = 0;
                            }
                            
                            continue;
                        }

                        const tempLesson = {
                            teacherId: selectedTeacher.id,
                            roomId: room.id,
                            date: dateStr,
                            dayOfWeek: italianDays[currentDate.getDay()],
                            startTime: `${currentHour.toString().padStart(2, '0')}:00`,
                            duration: lessonDuration,
                            subject: currentSubject.name,
                            courseId: course.id,
                            numberOfStudents: course.numberOfStudents
                        };

                        const conflict = checkConflict(tempLesson, existingLessonsToday);
                        if (!conflict) {
                            newLessons.push({
                                id: Date.now() + newLessons.length + Math.random(),
                                ...tempLesson
                            });
                            
                            existingLessonsToday.push(tempLesson);
                            course.remainingHours -= lessonDuration;
                            course.currentSubjectHours += lessonDuration;
                            teacherDailyHours[selectedTeacher.id] += lessonDuration;
                            totalScheduledHours += lessonDuration;
                            lessonsCreatedToday++;
                            
                            // Aggiorna il tracker totale per docente per materia
                            if (courseTeacherSubjectHours[course.id]?.[selectedTeacher.id]?.[currentSubject.id] !== undefined) {
                                courseTeacherSubjectHours[course.id][selectedTeacher.id][currentSubject.id] += lessonDuration;
                            }

                            if (course.currentSubjectHours >= currentSubject.hours) {
                                course.currentSubjectIndex++;
                                course.currentSubjectHours = 0;
                            }

                            canCreateMoreInThisSlot = true;
                        }
                    }
                }

                currentHour++;
            }
            
            if (lessonsCreatedToday > 0) {
                daysWithLessons++;
                activeCourses.forEach(c => {
                    const created = existingLessonsToday.filter(l => l.courseId === c.id).length;
                    if (created > 0) c.successfulDays++;
                });
            }

            currentDate.setDate(currentDate.getDate() + 1);
        }

        if (newLessons.length > 0) {
            setLessons([...lessons, ...newLessons]);
            
            const completedCourses = coursesData.filter(c => c.remainingHours <= 0);
            const partialCourses = coursesData.filter(c => c.remainingHours > 0);
            
            let message = `✅ Calendarizzazione globale completata!\n\n` +
                  `📚 Lezioni create: ${newLessons.length}\n` +
                  `⏱️ Ore totali programmate: ${totalScheduledHours}h\n` +
                  `✅ Corsi completati: ${completedCourses.length}\n` +
                  `📊 Corsi parziali: ${partialCourses.length}\n` +
                  `📅 Giorni utilizzati: ${daysWithLessons}/${daysProcessed}`;
            
            if (partialCourses.length > 0) {
                message += '\n\n⚠️ CORSI NON COMPLETATI:';
                partialCourses.forEach(c => {
                    message += `\n\n📚 ${c.name}:`;
                    message += `\n  • Ore mancanti: ${c.remainingHours}h`;
                    message += `\n  • Giorni tentati: ${c.attemptedDays}`;
                    message += `\n  • Giorni con lezioni: ${c.successfulDays}`;
                    if (courseIssues[c.id] && courseIssues[c.id].length > 0) {
                        message += '\n  • Problemi rilevati:';
                        courseIssues[c.id].forEach(issue => {
                            message += `\n    ${issue}`;
                        });
                    }
                });
            }
            
            alert(message);
        } else {
            let errorMessage = '❌ Impossibile calendarizzare i corsi.\n\n🔍 PROBLEMI RILEVATI:\n';
            
            if (Object.keys(courseIssues).length > 0) {
                Object.keys(courseIssues).forEach(courseId => {
                    const course = courses.find(c => c.id === parseInt(courseId));
                    if (course) {
                        errorMessage += `\n📚 ${course.name}:\n`;
                        courseIssues[courseId].forEach(issue => {
                            errorMessage += `  ${issue}\n`;
                        });
                    }
                });
            } else {
                errorMessage += '\n• Conflitti di orario persistenti\n';
                errorMessage += '• Tutti i docenti occupati\n';
                errorMessage += '• Limiti giornalieri troppo restrittivi\n';
            }
            
            errorMessage += '\n💡 SUGGERIMENTI:\n';
            errorMessage += '• Verifica che le date dei corsi siano valide\n';
            errorMessage += '• Controlla la capienza delle aule\n';
            errorMessage += '• Assegna docenti ai corsi\n';
            errorMessage += '• Aumenta i limiti di ore giornaliere\n';
            errorMessage += '• Estendi il periodo del corso';
            
            alert(errorMessage);
        }
    };

    const clearCourseCalendar = (courseId) => {
        const course = courses.find(c => c.id === courseId);
        const courseLessons = lessons.filter(l => l.courseId === courseId);
        
        if (courseLessons.length === 0) {
            alert('📅 Questo corso non ha lezioni calendarizzate.');
            return;
        }
        
        if (window.confirm(`🗑️ Vuoi cancellare tutte le ${courseLessons.length} lezioni del corso "${course.name}"?\n\nQuesta operazione non può essere annullata.`)) {
            setLessons(lessons.filter(l => l.courseId !== courseId));
            alert(`✅ Calendario del corso "${course.name}" cancellato!\n\n${courseLessons.length} lezioni eliminate.`);
        }
    };

    const autoScheduleCourse = (course) => {
        if (!course.startDate || !course.endDate) {
            alert('Il corso deve avere una data di inizio e fine');
            return;
        }

        const alreadyScheduled = getCourseScheduledHours(course.id);
        const totalAssignedHours = calculateAssignedHours(course);
        
        if (totalAssignedHours === 0) {
            alert('⚠️ Il corso non ha ore assegnate ai docenti! Aggiungi docenti e assegna ore per materia.');
            return;
        }
        
        if (alreadyScheduled >= totalAssignedHours) {
            alert('⚠️ Il corso è già completamente calendarizzato!');
            return;
        }

        const newLessons = [];
        const startDate = new Date(course.startDate);
        const endDate = new Date(course.endDate);
        const stageStart = course.stageStartDate ? new Date(course.stageStartDate) : null;
        const stageEnd = course.stageEndDate ? new Date(course.stageEndDate) : null;

        let currentDate = new Date(startDate);
        let totalScheduledHours = alreadyScheduled;
        let subjectIndex = 0;
        let currentSubjectHours = 0;

        const courseSubjects = getSubjectsFromTeachers(course);
        if (courseSubjects.length === 0) {
            alert('⚠️ Nessuna materia con ore assegnate!');
            return;
        }
        
        // Traccia ore totali per docente per materia (non solo giornaliere)
        const teacherSubjectHoursTotal = {};
        if (course.teachers && course.teachers.length > 0) {
            course.teachers.forEach(ct => {
                if (!teacherSubjectHoursTotal[ct.teacherId]) {
                    teacherSubjectHoursTotal[ct.teacherId] = {};
                }
                if (ct.subjects) {
                    ct.subjects.forEach(s => {
                        teacherSubjectHoursTotal[ct.teacherId][s.subjectId] = 0;
                    });
                }
            });
            
            // Conta ore già schedulate
            lessons.filter(l => l.courseId === course.id).forEach(lesson => {
                if (teacherSubjectHoursTotal[lesson.teacherId]) {
                    const lessonSubject = courseSubjects.find(s => s.name === lesson.subject);
                    if (lessonSubject && teacherSubjectHoursTotal[lesson.teacherId][lessonSubject.id] !== undefined) {
                        teacherSubjectHoursTotal[lesson.teacherId][lessonSubject.id] += lesson.duration;
                    }
                }
            });
        }

        while (totalScheduledHours < totalAssignedHours && currentDate <= endDate) {
            const dayOfWeek = currentDate.getDay();
            if (dayOfWeek === 0 || dayOfWeek === 6) {
                currentDate.setDate(currentDate.getDate() + 1);
                continue;
            }

            if (stageStart && stageEnd && currentDate >= stageStart && currentDate <= stageEnd) {
                currentDate.setDate(currentDate.getDate() + 1);
                continue;
            }

            if (subjectIndex >= courseSubjects.length) break;
            
            const currentSubject = courseSubjects[subjectIndex];
            
            let room = null;
            if (course.roomId) {
                const assignedRoom = rooms.find(r => r.id === course.roomId);
                if (assignedRoom && assignedRoom.capacity >= course.numberOfStudents) {
                    room = assignedRoom;
                }
            }
            
            if (!room) {
                room = rooms.find(r => r.capacity >= course.numberOfStudents);
            }

            if (!room) {
                alert(`ERRORE: Nessuna aula disponibile con almeno ${course.numberOfStudents} posti.`);
                break;
            }

            const dateStr = formatDate(currentDate);
            const existingLessonsToday = [...lessons, ...newLessons];
            
            const teacherHoursScheduled = {};
            if (course.teachers && course.teachers.length > 0) {
                course.teachers.forEach(ct => {
                    teacherHoursScheduled[ct.teacherId] = 0;
                });
                
                existingLessonsToday.forEach(lesson => {
                    if (lesson.courseId === course.id && teacherHoursScheduled[lesson.teacherId] !== undefined) {
                        teacherHoursScheduled[lesson.teacherId] += lesson.duration;
                    }
                });
            }
            
            let currentHour = 9;
            let hoursScheduledToday = 0;
            const remainingCourseHours = totalAssignedHours - totalScheduledHours;
            const maxHoursToday = Math.min(course.maxDailyHours, remainingCourseHours);
            
            while (hoursScheduledToday < maxHoursToday && currentHour < 18 && totalScheduledHours < totalAssignedHours) {
                const remainingSubjectHours = currentSubject.hours - currentSubjectHours;
                const remainingTodayHours = maxHoursToday - hoursScheduledToday;
                const stillNeeded = totalAssignedHours - totalScheduledHours;
                
                let lessonDuration = Math.min(
                    course.maxConsecutiveHours,
                    remainingSubjectHours,
                    remainingTodayHours,
                    stillNeeded
                );
                
                if (lessonDuration <= 0) {
                    break;
                }
                
                let selectedTeacher = null;
                if (course.teachers && course.teachers.length > 0) {
                    // Prendi la materia corrente
                    const currentSubject = courseSubjects[subjectIndex];
                    
                    for (let courseTeacher of course.teachers) {
                        // Verifica se questo docente ha ore assegnate per la materia corrente
                        const teacherSubject = (courseTeacher.subjects || []).find(s => s.subjectId === currentSubject.id);
                        if (!teacherSubject || teacherSubject.hours <= 0) continue;
                        
                        // Verifica quante ore ha già fatto per questa materia
                        const hoursAlreadyDone = teacherSubjectHoursTotal[courseTeacher.teacherId]?.[currentSubject.id] || 0;
                        if (hoursAlreadyDone >= teacherSubject.hours) continue;
                        
                        // Limita la durata della lezione alle ore rimanenti per questo docente per questa materia
                        const remainingForTeacher = teacherSubject.hours - hoursAlreadyDone;
                        const adjustedDuration = Math.min(lessonDuration, remainingForTeacher);
                        
                        const startTimeStr = `${currentHour.toString().padStart(2, '0')}:00`;
                        if (!isTeacherAvailable(courseTeacher.teacherId, dateStr, startTimeStr)) {
                            continue;
                        }
                        
                        const slot = findNextAvailableSlot(dateStr, currentHour, adjustedDuration, room.id, courseTeacher.teacherId, existingLessonsToday);
                        if (slot && slot.hour === currentHour) {
                            selectedTeacher = teachers.find(t => t.id === courseTeacher.teacherId);
                            lessonDuration = slot.duration;
                            break;
                        }
                    }
                } else {
                    const availableTeachers = teachers
                        .map(t => ({
                            teacher: t,
                            hoursToday: existingLessonsToday
                                .filter(l => l.teacherId === t.id)
                                .reduce((sum, l) => sum + l.duration, 0)
                        }))
                        .sort((a, b) => a.hoursToday - b.hoursToday);
                    
                    for (let {teacher} of availableTeachers) {
                        const startTimeStr = `${currentHour.toString().padStart(2, '0')}:00`;
                        if (!isTeacherAvailable(teacher.id, dateStr, startTimeStr)) {
                            continue;
                        }
                        
                        const slot = findNextAvailableSlot(dateStr, currentHour, lessonDuration, room.id, teacher.id, existingLessonsToday);
                        if (slot && slot.hour === currentHour) {
                            selectedTeacher = teacher;
                            lessonDuration = slot.duration;
                            break;
                        }
                    }
                }
                
                if (!selectedTeacher) {
                    // Verifica se tutti i docenti per questa materia hanno finito le loro ore
                    const allTeachersCompletedForSubject = course.teachers && course.teachers.every(ct => {
                        const teacherSubject = (ct.subjects || []).find(s => s.subjectId === currentSubject.id);
                        if (!teacherSubject || teacherSubject.hours <= 0) return true; // Docente non insegna questa materia
                        const hoursAlreadyDone = teacherSubjectHoursTotal[ct.teacherId]?.[currentSubject.id] || 0;
                        return hoursAlreadyDone >= teacherSubject.hours; // Docente ha finito le sue ore
                    });
                    
                    if (allTeachersCompletedForSubject) {
                        // Tutti i docenti hanno completato questa materia, passa alla successiva
                        subjectIndex++;
                        currentSubjectHours = 0;
                        if (subjectIndex >= courseSubjects.length) break;
                        continue;
                    }
                    
                    // Altrimenti prova l'ora successiva
                    currentHour++;
                    continue;
                }
                
                const tempLesson = {
                    teacherId: selectedTeacher.id,
                    roomId: room.id,
                    date: dateStr,
                    dayOfWeek: italianDays[currentDate.getDay()],
                    startTime: `${currentHour.toString().padStart(2, '0')}:00`,
                    duration: lessonDuration,
                    subject: currentSubject.name,
                    courseId: course.id,
                    numberOfStudents: course.numberOfStudents
                };

                const conflict = checkConflict(tempLesson, existingLessonsToday);
                if (!conflict) {
                    newLessons.push({
                        id: Date.now() + newLessons.length,
                        ...tempLesson
                    });
                    
                    hoursScheduledToday += lessonDuration;
                    totalScheduledHours += lessonDuration;
                    currentSubjectHours += lessonDuration;
                    
                    if (teacherHoursScheduled[selectedTeacher.id] !== undefined) {
                        teacherHoursScheduled[selectedTeacher.id] += lessonDuration;
                    }
                    
                    // Aggiorna il tracker totale per docente per materia
                    if (teacherSubjectHoursTotal[selectedTeacher.id] && teacherSubjectHoursTotal[selectedTeacher.id][currentSubject.id] !== undefined) {
                        teacherSubjectHoursTotal[selectedTeacher.id][currentSubject.id] += lessonDuration;
                    }
                    
                    if (currentSubjectHours >= currentSubject.hours) {
                        subjectIndex++;
                        currentSubjectHours = 0;
                        if (subjectIndex >= courseSubjects.length) break;
                    }
                }
                
                currentHour += lessonDuration;
            }

            currentDate.setDate(currentDate.getDate() + 1);
        }

        if (newLessons.length > 0) {
            const newTotal = totalScheduledHours - alreadyScheduled;
            setLessons([...lessons, ...newLessons]);
            alert(`✅ Corso calendarizzato! Create ${newLessons.length} lezioni per ${newTotal}h.\nTotale: ${totalScheduledHours}h/${totalAssignedHours}h (${((totalScheduledHours/totalAssignedHours)*100).toFixed(1)}%)`);
        } else {
            alert('❌ Impossibile calendarizzare il corso.');
        }
    };

    const addLesson = () => {
        if (newLesson.teacherId && newLesson.roomId && newLesson.subject && newLesson.date && newLesson.numberOfStudents) {
            if (!isTeacherAvailable(parseInt(newLesson.teacherId), newLesson.date, newLesson.startTime)) {
                const teacher = teachers.find(t => t.id === parseInt(newLesson.teacherId));
                alert(`⚠️ Il docente ${teacher?.name} non è disponibile in questa data/orario!\n\nVerifica le indisponibilità del docente nella sezione Docenti.`);
                return;
            }
            
            const conflict = checkConflict(newLesson);
            if (conflict) {
                alert(`Errore: ${conflict}`);
                return;
            }
            
            if (newLesson.courseId) {
                const courseId = parseInt(newLesson.courseId);
                const course = courses.find(c => c.id === courseId);
                if (course) {
                    const currentScheduled = getCourseScheduledHours(courseId);
                    const newTotal = currentScheduled + parseInt(newLesson.duration);
                    const assignedHours = calculateAssignedHours(course);
                    if (newTotal > assignedHours) {
                        alert(`⚠️ Attenzione! Questa lezione porterebbe il corso a ${newTotal}h su ${course.totalHours}h totali (${((newTotal/course.totalHours)*100).toFixed(1)}%).\n\nIl corso verrebbe programmato oltre il 100%.`);
                        if (!window.confirm('Vuoi procedere comunque?')) {
                            return;
                        }
                    }
                }
            }
            
            const lessonDate = new Date(newLesson.date);
            const dayOfWeek = italianDays[lessonDate.getDay()];
            setLessons([...lessons, { 
                ...newLesson,
                id: Date.now(),
                dayOfWeek: dayOfWeek,
                teacherId: parseInt(newLesson.teacherId),
                roomId: parseInt(newLesson.roomId),
                duration: parseInt(newLesson.duration),
                numberOfStudents: parseInt(newLesson.numberOfStudents),
                courseId: newLesson.courseId ? parseInt(newLesson.courseId) : undefined
            }]);
            setNewLesson({
                teacherId: '', roomId: '', date: new Date().toISOString().split('T')[0],
                startTime: '09:00', duration: 1, subject: '', numberOfStudents: '', courseId: ''
            });
            setShowAddLesson(false);
        }
    };

    const deleteLesson = (id) => {
        const lesson = lessons.find(l => l.id === id);
        let confirmMessage = 'Sei sicuro di voler eliminare questa lezione?';
        
        if (lesson && lesson.courseId) {
            const course = courses.find(c => c.id === lesson.courseId);
            if (course) {
                const currentScheduled = getCourseScheduledHours(lesson.courseId);
                const afterDeletion = currentScheduled - lesson.duration;
                const assignedHours = calculateAssignedHours(course);
                confirmMessage = `Vuoi eliminare questa lezione?\n\nCorso: ${course.name}\nOre dopo eliminazione: ${afterDeletion}h/${assignedHours}h (${((afterDeletion/assignedHours)*100).toFixed(1)}%)`;
            }
        }
        
        if (window.confirm(confirmMessage)) {
            setLessons(lessons.filter(l => l.id !== id));
            setSelectedLesson(null);
        }
    };

    const updateLessonDetails = () => {
        if (editingLesson.teacherId && editingLesson.roomId && editingLesson.subject && editingLesson.numberOfStudents) {
            if (!isTeacherAvailable(parseInt(editingLesson.teacherId), editingLesson.date, editingLesson.startTime)) {
                const teacher = teachers.find(t => t.id === parseInt(editingLesson.teacherId));
                alert(`⚠️ Il docente ${teacher?.name} non è disponibile in questa data/orario!\n\nVerifica le indisponibilità del docente nella sezione Docenti.`);
                return;
            }
            
            const conflict = checkConflict(editingLesson);
            if (conflict) {
                alert(`Errore: ${conflict}`);
                return;
            }
            
            if (editingLesson.courseId) {
                const oldLesson = lessons.find(l => l.id === editingLesson.id);
                const courseId = parseInt(editingLesson.courseId);
                const course = courses.find(c => c.id === courseId);
                if (course && oldLesson) {
                    const currentScheduled = getCourseScheduledHours(courseId);
                    const durationDiff = parseInt(editingLesson.duration) - oldLesson.duration;
                    const newTotal = currentScheduled + durationDiff;
                    if (newTotal > course.totalHours && durationDiff > 0) {
                    const assignedHours = calculateAssignedHours(course);
                        alert(`⚠️ Attenzione! Questa modifica porterebbe il corso a ${newTotal}h su ${assignedHours}h (${((newTotal/assignedHours)*100).toFixed(1)}%).`);
                        if (!window.confirm('Vuoi procedere comunque?')) {
                            return;
                        }
                    }
                }
            }
            
            setLessons(lessons.map(l => l.id === editingLesson.id ? {
                ...editingLesson,
                teacherId: parseInt(editingLesson.teacherId),
                roomId: parseInt(editingLesson.roomId),
                duration: parseInt(editingLesson.duration),
                numberOfStudents: parseInt(editingLesson.numberOfStudents),
                courseId: editingLesson.courseId ? parseInt(editingLesson.courseId) : undefined
            } : l));
            setShowEditLessonDetails(false);
            setEditingLesson(null);
            setSelectedLesson(null);
        }
    };

    const addCourse = () => {
        if (newCourse.name && newCourse.totalHours && newCourse.startDate && newCourse.endDate && newCourse.numberOfStudents) {
            const course = {
                ...newCourse,
                id: Date.now(),
                totalHours: parseInt(newCourse.totalHours),
                maxDailyHours: parseInt(newCourse.maxDailyHours),
                maxConsecutiveHours: parseInt(newCourse.maxConsecutiveHours),
                numberOfStudents: parseInt(newCourse.numberOfStudents),
                roomId: newCourse.roomId ? parseInt(newCourse.roomId) : undefined,
                teachers: (newCourse.teachers || []).map(t => ({
                    teacherId: parseInt(t.teacherId),
                    subjects: t.subjects || []
                }))
            };
            setCourses([...courses, course]);
            setNewCourse({
                name: '', totalHours: 0, maxDailyHours: 4, maxConsecutiveHours: 4,
                startDate: '', endDate: '', teachers: [],
                stageStartDate: '', stageEndDate: '', numberOfStudents: '', roomId: ''
            });
            setShowAddCourse(false);
        }
    };

    const updateCourse = () => {
        if (editingCourse.name && editingCourse.totalHours && editingCourse.startDate && editingCourse.endDate && editingCourse.numberOfStudents) {
            const currentScheduled = getCourseScheduledHours(editingCourse.id);
            const newTotalHours = parseInt(editingCourse.totalHours);
            if (newTotalHours < currentScheduled) {
                alert(`⚠️ Attenzione! Hai già ${currentScheduled}h programmate per questo corso.\nNon puoi impostare il totale a ${newTotalHours}h.`);
                return;
            }
            
            setCourses(courses.map(c => c.id === editingCourse.id ? {
                ...editingCourse,
                totalHours: newTotalHours,
                maxDailyHours: parseInt(editingCourse.maxDailyHours),
                maxConsecutiveHours: parseInt(editingCourse.maxConsecutiveHours),
                numberOfStudents: parseInt(editingCourse.numberOfStudents),
                roomId: editingCourse.roomId ? parseInt(editingCourse.roomId) : undefined,
                teachers: (editingCourse.teachers || []).map(t => ({
                    teacherId: parseInt(t.teacherId),
                    subjects: t.subjects || []
                }))
            } : c));
            setShowEditCourse(false);
            setEditingCourse(null);
        }
    };

    const deleteCourse = (id) => {
        if (window.confirm('Sei sicuro di voler eliminare questo corso? Tutte le lezioni associate verranno eliminate.')) {
            setCourses(courses.filter(c => c.id !== id));
            setLessons(lessons.filter(l => l.courseId !== id));
            // Libera il colore assegnato
            setCourseColorMap(prev => {
                const newMap = {...prev};
                delete newMap[id];
                return newMap;
            });
        }
    };

    const duplicateCourse = (course) => {
        const duplicated = {
            ...course,
            id: Date.now(),
            name: `${course.name} - COPIA`
        };
        setCourses([...courses, duplicated]);
        alert(`✅ Corso duplicato con successo!\n\n📚 Nuovo corso: "${duplicated.name}"\n\n⚠️ Nota: Solo la struttura del corso è stata duplicata. Le lezioni non sono state copiate.`);
    };

    const addTeacher = () => {
        if (newTeacher.name && newTeacher.email) {
            setTeachers([...teachers, { ...newTeacher, id: Date.now(), subjectIds: newTeacher.subjectIds || [], unavailability: [] }]);
            setNewTeacher({ name: '', email: '', subjectIds: [], unavailability: [] });
            setShowAddTeacher(false);
        }
    };

    const updateTeacher = () => {
        if (editingTeacher.name && editingTeacher.email) {
            setTeachers(teachers.map(t => t.id === editingTeacher.id ? editingTeacher : t));
            setShowEditTeacher(false);
            setEditingTeacher(null);
        }
    };

    const toggleTeacherSubject = (teacher, setTeacher, subjectId) => {
        const currentSubjects = teacher.subjectIds || [];
        const newSubjects = currentSubjects.includes(subjectId)
            ? currentSubjects.filter(id => id !== subjectId)
            : [...currentSubjects, subjectId];
        setTeacher({ ...teacher, subjectIds: newSubjects });
    };

    const deleteTeacher = (id) => {
        if (window.confirm('Sei sicuro?')) {
            setTeachers(teachers.filter(t => t.id !== id));
        }
    };

    const addRoom = () => {
        if (newRoom.name && newRoom.capacity) {
            setRooms([...rooms, { ...newRoom, id: Date.now(), capacity: parseInt(newRoom.capacity) }]);
            setNewRoom({ name: '', capacity: 20, type: 'Didattica', hasProjector: false });
            setShowAddRoom(false);
        }
    };

    const updateRoom = () => {
        if (editingRoom.name && editingRoom.capacity) {
            setRooms(rooms.map(r => r.id === editingRoom.id ? {...editingRoom, capacity: parseInt(editingRoom.capacity)} : r));
            setShowEditRoom(false);
            setEditingRoom(null);
        }
    };

    const deleteRoom = (id) => {
        if (window.confirm('Sei sicuro?')) {
            setRooms(rooms.filter(r => r.id !== id));
        }
    };

    const addSubject = () => {
        if (newSubject.name) {
            setSubjects([...subjects, { ...newSubject, id: Date.now() }]);
            setNewSubject({ name: '' });
            setShowAddSubject(false);
        }
    };

    const updateSubject = () => {
        if (editingSubject.name) {
            setSubjects(subjects.map(s => s.id === editingSubject.id ? editingSubject : s));
            setShowEditSubject(false);
            setEditingSubject(null);
        }
    };

    const deleteSubject = (id) => {
        // Verifica se ci sono docenti che insegnano questa materia
        const teachersWithSubject = teachers.filter(t => t.subjectIds && t.subjectIds.includes(id));
        
        if (teachersWithSubject.length > 0) {
            const teacherNames = teachersWithSubject.map(t => t.name).join(', ');
            if (!window.confirm(`⚠️ Attenzione!\n\nQuesta materia è assegnata a ${teachersWithSubject.length} docenti:\n${teacherNames}\n\nLa materia verrà rimossa anche dai docenti. Continuare?`)) {
                return;
            }
            // Rimuovi la materia dai docenti
            setTeachers(teachers.map(t => ({
                ...t,
                subjectIds: t.subjectIds ? t.subjectIds.filter(sid => sid !== id) : []
            })));
        }
        
        if (window.confirm('Sei sicuro di voler eliminare questa materia?')) {
            setSubjects(subjects.filter(s => s.id !== id));
        }
    };

    const getSubjectsFromTeachers = (course) => {
        const subjectHoursMap = {};
        
        if (!course.teachers || course.teachers.length === 0) {
            return [];
        }
        
        course.teachers.forEach(teacher => {
            if (!teacher.subjects) return;
            teacher.subjects.forEach(ts => {
                const subject = subjects.find(s => s.id === ts.subjectId);
                if (subject && ts.hours > 0) {
                    if (!subjectHoursMap[ts.subjectId]) {
                        subjectHoursMap[ts.subjectId] = {
                            id: ts.subjectId,
                            name: subject.name,
                            hours: 0
                        };
                    }
                    subjectHoursMap[ts.subjectId].hours += ts.hours;
                }
            });
        });
        
        return Object.values(subjectHoursMap);
    };

    const normalizeCourseForEditing = (course) => {
        const normalizedCourse = {...course};
        
        // Inizializza subjects per ogni docente se non esiste
        if (normalizedCourse.teachers && normalizedCourse.teachers.length > 0) {
            normalizedCourse.teachers = normalizedCourse.teachers.map(ct => {
                if (!ct.subjects) {
                    const teacher = teachers.find(t => t.id === parseInt(ct.teacherId));
                    if (teacher && teacher.subjectIds) {
                        return {
                            ...ct,
                            subjects: teacher.subjectIds.map(subjectId => ({
                                subjectId: subjectId,
                                hours: 0
                            }))
                        };
                    }
                }
                return ct;
            });
        }
        
        return normalizedCourse;
    };

    const calculateAssignedHours = (course) => {
        if (!course.teachers || course.teachers.length === 0) return 0;
        return course.teachers.reduce((total, teacher) => {
            if (!teacher.subjects || teacher.subjects.length === 0) return total;
            const teacherHours = teacher.subjects.reduce((sum, s) => sum + (parseInt(s.hours) || 0), 0);
            return total + teacherHours;
        }, 0);
    };

    const addTeacherToCourse = (courseState, setCourseState) => {
        setCourseState({...courseState, teachers: [...(courseState.teachers || []), { teacherId: '', subjects: [] }]});
    };

    const updateCourseTeacher = (courseState, setCourseState, index, field, value) => {
        const newTeachers = [...courseState.teachers];
        newTeachers[index][field] = value;
        
        // Se cambia il docente, inizializza le materie con quelle del nuovo docente
        if (field === 'teacherId' && value) {
            const teacher = teachers.find(t => t.id === parseInt(value));
            if (teacher && teacher.subjectIds) {
                newTeachers[index].subjects = teacher.subjectIds.map(subjectId => ({
                    subjectId: subjectId,
                    hours: 0
                }));
            }
        }
        
        setCourseState({...courseState, teachers: newTeachers});
    };

    const updateTeacherSubjectHours = (courseState, setCourseState, teacherIndex, subjectId, hours) => {
        const newTeachers = [...courseState.teachers];
        
        // Inizializza subjects se non esiste
        if (!newTeachers[teacherIndex].subjects) {
            newTeachers[teacherIndex].subjects = [];
        }
        
        const subjectIndex = newTeachers[teacherIndex].subjects.findIndex(s => s.subjectId === subjectId);
        
        if (subjectIndex !== -1) {
            // Aggiorna ore esistenti
            newTeachers[teacherIndex].subjects[subjectIndex].hours = parseInt(hours) || 0;
        } else {
            // Aggiungi nuovo subject con ore
            newTeachers[teacherIndex].subjects.push({
                subjectId: subjectId,
                hours: parseInt(hours) || 0
            });
        }
        
        setCourseState({...courseState, teachers: newTeachers});
    };

    const removeCourseTeacher = (courseState, setCourseState, index) => {
        setCourseState({...courseState, teachers: courseState.teachers.filter((_, i) => i !== index)});
    };

    const UnavailabilityManager = ({ teacher, onUpdate }) => {
        const [selectedDay, setSelectedDay] = useState(1);
        const [selectedTime, setSelectedTime] = useState('09:00');
        const [isFullDay, setIsFullDay] = useState(false);

        const handleAddUnavailability = () => {
            const updated = addUnavailability(teacher, selectedDay, isFullDay ? null : selectedTime);
            onUpdate(updated);
        };

        const handleRemoveUnavailability = (day, timeSlot) => {
            const updated = removeUnavailability(teacher, day, timeSlot);
            onUpdate(updated);
        };

        const getUnavailabilityForDay = (day) => {
            const dayUnavail = (teacher.unavailability || []).find(u => u.day === day);
            return dayUnavail ? dayUnavail : null;
        };

        const isFullDayBlocked = (day) => {
            const dayUnavail = getUnavailabilityForDay(day);
            return dayUnavail && (!dayUnavail.timeSlots || dayUnavail.timeSlots.length === 0);
        };

        return (
            <div className="mt-4 p-4 bg-gray-50 rounded-lg border-2 border-yellow-300">
                <h4 className="font-bold mb-3 flex items-center gap-2">
                    <ClockIcon />
                    Gestione Indisponibilità
                </h4>
                
                <div className="mb-4 p-3 bg-blue-50 rounded border border-blue-200">
                    <p className="text-sm text-blue-800">
                        <strong>Come funziona:</strong> Seleziona i giorni e le fasce orarie in cui il docente NON è disponibile per fare lezione.
                        Puoi bloccare un giorno intero oppure solo fasce orarie specifiche.
                    </p>
                </div>

                <div className="space-y-3 mb-3">
                    <select 
                        value={selectedDay} 
                        onChange={(e) => setSelectedDay(parseInt(e.target.value))}
                        className="w-full p-2 border rounded"
                    >
                        {italianDays.slice(1, 6).map((day, idx) => (
                            <option key={idx + 1} value={idx + 1}>
                                {day}
                            </option>
                        ))}
                    </select>

                    <label className="flex items-center gap-2 p-2 border rounded bg-white cursor-pointer">
                        <input 
                            type="checkbox" 
                            checked={isFullDay} 
                            onChange={(e) => setIsFullDay(e.target.checked)}
                            className="w-4 h-4"
                        />
                        <span>Blocca l'intero giorno</span>
                    </label>

                    {!isFullDay && (
                        <select 
                            value={selectedTime} 
                            onChange={(e) => setSelectedTime(e.target.value)}
                            className="w-full p-2 border rounded"
                        >
                            {TIME_SLOTS.map(time => (
                                <option key={time} value={time}>{time}</option>
                            ))}
                        </select>
                    )}
                </div>

                <button 
                    onClick={handleAddUnavailability}
                    className="w-full px-3 py-2 bg-yellow-600 text-white rounded hover:bg-yellow-700 flex items-center justify-center gap-2 mb-4"
                >
                    <PlusIcon />
                    {isFullDay ? 'Blocca Giorno Intero' : 'Aggiungi Fascia Oraria'}
                </button>

                <div className="space-y-2">
                    <h5 className="font-semibold text-sm text-gray-700">Indisponibilità Attuali:</h5>
                    {italianDays.slice(1, 6).map((dayName, idx) => {
                        const dayNum = idx + 1;
                        const dayUnavail = getUnavailabilityForDay(dayNum);
                        if (!dayUnavail) return null;
                        
                        const fullDay = isFullDayBlocked(dayNum);
                        
                        return (
                            <div key={dayNum} className="bg-white p-2 rounded border">
                                <div className="font-semibold text-sm mb-1 flex items-center justify-between">
                                    <span>{dayName}</span>
                                    {fullDay && (
                                        <button
                                            onClick={() => handleRemoveUnavailability(dayNum, null)}
                                            className="px-2 py-1 bg-red-100 text-red-800 rounded text-xs hover:bg-red-200"
                                        >
                                            Rimuovi blocco giorno
                                        </button>
                                    )}
                                </div>
                                {fullDay ? (
                                    <span className="inline-flex items-center px-2 py-1 bg-red-200 text-red-900 rounded text-xs font-bold">
                                        🚫 GIORNO INTERO BLOCCATO
                                    </span>
                                ) : (
                                    <div className="flex flex-wrap gap-1">
                                        {(dayUnavail.timeSlots || []).map(time => (
                                            <span 
                                                key={time}
                                                className="inline-flex items-center gap-1 px-2 py-1 bg-red-100 text-red-800 rounded text-xs"
                                            >
                                                {time}
                                                <button
                                                    onClick={() => handleRemoveUnavailability(dayNum, time)}
                                                    className="hover:bg-red-200 rounded-full"
                                                >
                                                    ×
                                                </button>
                                            </span>
                                        ))}
                                    </div>
                                )}
                            </div>
                        );
                    })}
                    {(teacher.unavailability || []).length === 0 && (
                        <p className="text-sm text-gray-500 italic">Nessuna indisponibilità impostata</p>
                    )}
                </div>
            </div>
        );
    };

    return (
        <div className="min-h-screen bg-gray-50 p-6">
            <div className="max-w-7xl mx-auto">
                <div className="bg-gradient-to-r from-blue-600 to-indigo-600 rounded-lg shadow-lg p-6 mb-6 text-white">
                    <div className="flex justify-between items-start">
                        <div>
                            <h1 className="text-3xl font-bold mb-2">N.S.E. - Next School Engine</h1>
                            <p className="text-blue-100">🚀 v3.3.8 - Materie Alfabetiche Insegnanti</p>
                            <p className="text-blue-100">💾 Checkbox materie in ordine alfabetico A-Z</p>
                        </div>
                        <div className="text-right">
                            <div className="bg-white/20 backdrop-blur-sm px-4 py-2 rounded-lg border border-white/30">
                                <div className="text-xs text-blue-100">Versione</div>
                                <div className="text-2xl font-bold">3.3.8</div>
                            </div>
                        </div>
                    </div>
                </div>

                {/* 🔥 NUOVO: Banner con pulsanti Export/Import/Clear */}
                <div className="bg-white rounded-lg shadow p-4 mb-6 border-2 border-green-400">
                    <div className="flex flex-wrap gap-4 items-center justify-between">
                        <div className="flex items-center gap-2">
                            <DatabaseIcon />
                            <div>
                                <h3 className="font-bold text-gray-800">Gestione Dati</h3>
                                <p className="text-sm text-gray-600">I dati vengono salvati automaticamente nel browser</p>
                            </div>
                        </div>
                        <div className="flex gap-2 flex-wrap">
                            <button 
                                onClick={exportData}
                                className="flex items-center gap-2 px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 shadow"
                            >
                                <DownloadIcon />
                                Esporta Backup
                            </button>
                            <label className="flex items-center gap-2 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 shadow cursor-pointer">
                                <UploadIcon />
                                Importa Dati
                                <input 
                                    type="file" 
                                    accept=".json" 
                                    onChange={importData}
                                    className="hidden"
                                />
                            </label>
                            <button 
                                onClick={clearAllData}
                                className="flex items-center gap-2 px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 shadow"
                            >
                                <Trash2Icon />
                                Reset Tutto
                            </button>
                        </div>
                    </div>
                </div>

                <div className="flex gap-4 mb-6 flex-wrap">
                    {[
